<style>
/* ══════════════════════════ 1 · TOKENS ══════════════════════════ */
:root{
  --void:#0D0D0D; --coal:#1C1C1C; --ink:#141414; --slate:#26232A;
  --crimson:#5B0E14; --crimson-lt:#7C1620; --crimson-deep:#3D080D;

  --gold:#C8A96A; --gold-lt:#E0C68F; --gold-pale:#F2E6C9; --gold-deep:#6E5216;
  --leaf:linear-gradient(147deg,#7A5C20 0%,#C8A96A 20%,#F2E6C9 40%,#BE9E5C 56%,#E8D3A0 74%,#8A6A28 100%);

  --parch:#E7DBBE; --parch-2:#D9C9A3; --parch-3:#C7B489; --cream:#F2E6C9;
  --sepia:#3A3226; --sepia-2:#5C5040; --sepia-3:#7E7059;

  --display:"Playfair Display",Georgia,serif;
  --body:"Cormorant Garamond",Georgia,serif;
  --sign:"Mrs Saint Delafield",cursive;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

  --gut:clamp(1.15rem,4vw,4.5rem);
  --ease:cubic-bezier(.22,.61,.36,1);
  --swing:cubic-bezier(.65,.02,.28,1);
  --bar:clamp(3.75rem,6vw,5.25rem);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--void)}
body{
  margin:0;color:var(--parch);
  font-family:var(--body);font-weight:400;font-size:1.06rem;line-height:1.68;
  background:var(--void);overflow-x:hidden;min-height:100vh;
}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--crimson);color:var(--cream)}

/* ══════════════════════ 2 · ATMOSPHERE ══════════════════════ */
.atmos{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.85}
.fog{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.fog.f1{width:70vw;height:60vh;left:-14vw;top:-10vh;
  background:radial-gradient(circle,rgba(139,26,43,.22),transparent 66%);
  animation:drift1 46s ease-in-out infinite alternate}
.fog.f2{width:64vw;height:56vh;right:-12vw;top:14vh;
  background:radial-gradient(circle,rgba(201,162,39,.16),transparent 66%);
  animation:drift2 58s ease-in-out infinite alternate}
.fog.f3{width:86vw;height:52vh;left:8vw;bottom:-16vh;
  background:radial-gradient(circle,rgba(70,60,90,.20),transparent 68%);
  animation:drift3 66s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(8vw,6vh,0) scale(1.16)}}
@keyframes drift2{to{transform:translate3d(-7vw,9vh,0) scale(1.2)}}
@keyframes drift3{to{transform:translate3d(5vw,-7vh,0) scale(1.12)}}

.ray{position:absolute;top:-38vh;left:22%;width:44vw;height:170vh;
  background:linear-gradient(103deg,transparent 44%,rgba(242,227,180,.055) 50%,transparent 56%);
  transform:rotate(11deg);mix-blend-mode:screen;
  animation:ray 34s ease-in-out infinite alternate}
@keyframes ray{to{transform:rotate(15deg) translateX(9vw);opacity:.55}}

.mote{position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--gold-pale);opacity:0;filter:blur(.4px);
  animation:mote linear infinite}
@keyframes mote{
  0%{opacity:0;transform:translate3d(0,0,0)}
  12%{opacity:.85}
  88%{opacity:.5}
  100%{opacity:0;transform:translate3d(var(--mx,30px),-108vh,0)}
}
.vign{position:absolute;inset:0;
  background:radial-gradient(128% 92% at 50% 38%,transparent 34%,rgba(6,6,8,.6) 76%,#050506 100%)}
.noise{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:.4;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.32'/></svg>")}
@media (prefers-reduced-motion:reduce){
  .fog,.ray,.mote{animation:none!important}
  .mote{opacity:.4}
}

/* ══════════════════════ 3 · GOLD & ORNAMENT ══════════════════════ */
.gold{background:var(--leaf);-webkit-background-clip:text;background-clip:text;color:transparent}
.fil{display:block;width:100%;height:auto;opacity:.92;pointer-events:none}
.qi{color:var(--gold)}
.qi path{fill:currentColor}
.contact .qi{width:1.7rem;margin:0 auto}

.mono{display:inline-block;font-family:var(--display);font-weight:500;
  line-height:.85;letter-spacing:-.06em}
.mono i{font-style:normal;margin-left:-.16em}
.mono-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:.1em}

/* ══════════════════════ 4 · MASTHEAD ══════════════════════ */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:60;height:var(--bar);
  display:flex;align-items:center;gap:clamp(.75rem,2.5vw,2.5rem);
  padding:0 var(--gut);
  background:linear-gradient(to bottom,rgba(9,9,11,.94),rgba(9,9,11,.78));
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid rgba(201,162,39,.22);
  transition:background .5s var(--ease),border-color .5s var(--ease);
}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(to right,transparent,rgba(201,162,39,.55),transparent)}
.brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;flex:none}
.brand .mono{font-size:clamp(1.7rem,3vw,2.3rem)}
.brand .crest{height:clamp(2.3rem,4vw,3.1rem);width:auto;display:block}
.brand .fl{width:2.4rem;height:.6rem;margin-top:-.15rem}
.brand-txt{display:flex;flex-direction:column;gap:.12rem}
.brand-txt b{font-family:var(--display);font-weight:500;font-size:clamp(.78rem,1.3vw,.98rem);
  letter-spacing:.14em;color:var(--gold-lt);white-space:nowrap}
.brand-txt span{font-family:var(--body);font-size:clamp(.6rem,1vw,.72rem);
  letter-spacing:.26em;color:var(--sepia-3);white-space:nowrap}
.nav{margin-left:auto;display:flex;align-items:center;gap:clamp(.9rem,2.6vw,2.6rem)}
.nav a{font-family:var(--body);font-weight:500;font-size:clamp(.72rem,1.15vw,.86rem);
  letter-spacing:.24em;text-transform:uppercase;text-decoration:none;color:#A79C86;
  position:relative;padding:.4rem 0;transition:color .35s}
.nav a::after{content:"";position:absolute;left:50%;right:50%;bottom:0;height:1px;
  background:var(--gold);transition:left .4s var(--ease),right .4s var(--ease)}
.nav a:hover{color:var(--gold-pale)}
.nav a:hover::after,.nav a[aria-current="page"]::after{left:0;right:0}
.nav a[aria-current="page"]{color:var(--gold-lt)}
.bar .quill{width:1px;height:1.8rem;background:rgba(201,162,39,.3);margin-left:.4rem}
.bar .qi{width:1.05rem;flex:none;opacity:.9}
.bar .qi path{fill:var(--gold)}
@media (max-width:900px){
  .brand-txt{display:none}
  .nav{gap:1.4rem;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    margin-left:auto;padding:0 .25rem;mask-image:linear-gradient(to right,transparent,#000 12px,#000 calc(100% - 18px),transparent)}
  .nav::-webkit-scrollbar{display:none}
  .nav a{letter-spacing:.15em;font-size:.68rem;white-space:nowrap;flex:none}
}
@media (max-width:560px){
  .hero{min-height:calc(88svh - var(--bar))}
  .hero-say{font-size:clamp(1.5rem,7.4vw,2.4rem);max-width:16ch}
  .archead{min-height:12rem}
  .kfoot .brandcol{flex-direction:column;align-items:flex-start;gap:.75rem}
}

/* ══════════════════════ 5 · SHELL ══════════════════════ */
main{position:relative;z-index:2;padding-top:var(--bar)}
.wrap{max-width:78rem;margin:0 auto;padding:0 var(--gut)}
.wrap.wide{max-width:110rem}
.eyebrow{font-family:var(--body);font-weight:500;font-size:.76rem;letter-spacing:.34em;
  text-transform:uppercase;color:var(--gold);opacity:.9}
.centre{text-align:center}

/* ══════════════════════ 6 · HOME ══════════════════════ */
.hero{position:relative;min-height:calc(100svh - var(--bar));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(2rem,7vh,5rem) var(--gut) clamp(3rem,9vh,6rem);
  margin-top:calc(var(--bar) * -1);padding-top:calc(var(--bar) + clamp(2rem,7vh,5rem));
  isolation:isolate;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-2;background:var(--void) center/cover no-repeat;
  animation:heroIn 2.6s var(--ease) both}
@keyframes heroIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.hero-bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(66% 78% at 50% 46%,rgba(9,9,11,.9) 0%,rgba(9,9,11,.55) 42%,transparent 70%),
             linear-gradient(to bottom,rgba(9,9,11,.72) 0%,transparent 22%,transparent 62%,rgba(9,9,11,.96) 100%),
             linear-gradient(to right,rgba(9,9,11,.55),transparent 22%,transparent 78%,rgba(9,9,11,.55))}
.hero-crest{width:clamp(5.5rem,11vw,9.5rem);margin:0 auto clamp(.75rem,2vh,1.4rem);
  filter:drop-shadow(0 6px 26px rgba(201,162,39,.34))}
.hero-line{width:min(26rem,72vw);height:1.5rem;margin:clamp(1.4rem,3.5vh,2.2rem) auto}
.hero-mono{font-size:clamp(3.4rem,9vw,7rem);line-height:.82}
.hero-fl{width:clamp(5rem,10vw,8rem);height:1.4rem;margin:.5rem auto clamp(1.4rem,4vh,2.4rem)}
.hero-title{font-family:var(--display);font-weight:600;
  font-size:clamp(2.4rem,7.4vw,6.4rem);line-height:.96;letter-spacing:.012em;
  margin:0 0 .9rem;text-wrap:balance;max-width:13ch}
.hero-sub{font-family:var(--body);font-weight:500;font-size:clamp(.74rem,1.5vw,.95rem);
  letter-spacing:.42em;text-transform:uppercase;color:var(--sepia-3);margin:0 0 clamp(2rem,5vh,3rem)}
.hero-rule{width:min(22rem,60vw);height:1.4rem;margin:0 auto clamp(1.8rem,4.5vh,2.6rem)}
.hero-say{font-family:var(--display);font-style:italic;font-weight:400;
  font-size:clamp(1.15rem,2.7vw,2.05rem);line-height:1.44;color:var(--gold-lt);
  margin:0 auto .9rem;max-width:26ch;text-wrap:balance;
  text-shadow:0 2px 18px rgba(9,9,11,.9)}
.hero-name{font-family:var(--body);font-weight:500;font-size:clamp(.74rem,1.3vw,.88rem);
  letter-spacing:.34em;text-transform:uppercase;color:var(--sepia-3);margin:0}
.scrollcue{position:absolute;bottom:clamp(1.25rem,4vh,2.5rem);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.6rem;
  font-family:var(--body);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sepia-3);text-decoration:none;transition:color .4s}
.scrollcue:hover{color:var(--gold)}
.scrollcue .ln{width:1px;height:3rem;background:linear-gradient(to bottom,rgba(201,162,39,.6),transparent);
  animation:cue 2.6s ease-in-out infinite}
@keyframes cue{0%,100%{transform:scaleY(.4);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}}

/* section heading with filigree rules */
.sec{padding:clamp(3rem,9vh,7rem) 0}
.sec-head{display:flex;align-items:center;gap:1.5rem;margin-bottom:clamp(2rem,5vh,3.5rem)}
.sec-head .ln{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(201,162,39,.42),transparent)}
.sec-head h2{font-family:var(--display);font-weight:500;font-size:clamp(1.15rem,2.4vw,1.7rem);
  letter-spacing:.2em;text-transform:uppercase;margin:0;white-space:nowrap;color:var(--gold-lt)}

/* ── the featured story: a framed plate ── */
.feature{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(1.75rem,4.5vw,4rem);align-items:center}
.plate{position:relative;display:block;overflow:hidden;background:var(--coal);
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),
    calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
  transition:transform 1.1s var(--ease)}
.plate img{width:100%;aspect-ratio:16/10;object-fit:cover;
  filter:saturate(.72) contrast(1.12) brightness(.86);
  transition:transform 1.4s var(--ease),filter .8s}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(9,9,11,.72),transparent 52%),
             radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(9,9,11,.5) 100%)}
.plate-fr{position:absolute;inset:9px;border:1px solid rgba(201,162,39,.34);pointer-events:none;z-index:2;
  clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% calc(100% - 16px),
    calc(100% - 16px) 100%,16px 100%,0 calc(100% - 16px),0 16px)}
a.card:hover .plate img{transform:scale(1.06);filter:saturate(.85) contrast(1.12) brightness(.95)}
.feature-txt h3{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,4.2vw,3.4rem);
  line-height:1.06;margin:.7rem 0 .9rem;transition:color .4s}
a.card{text-decoration:none;display:block}
a.card:hover .feature-txt h3,a.card:hover .st-txt h3{color:var(--gold-lt)}
.feature-txt p{font-family:var(--display);font-style:italic;font-size:clamp(1rem,1.7vw,1.25rem);
  color:#A79C86;margin:0 0 1.4rem;max-width:34rem}
.meta{font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--sepia-3)}
.readmore{display:inline-flex;align-items:center;gap:.8rem;margin-top:1.6rem;
  font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--gold)}
.readmore .ar{width:2.2rem;height:1px;background:currentColor;transition:width .5s var(--ease)}
a.card:hover .readmore .ar{width:3.4rem}
@media (max-width:880px){.feature{grid-template-columns:1fr}}

/* ── the story strip ── */
.strip{display:grid;gap:1px;background:rgba(201,162,39,.16);border:1px solid rgba(201,162,39,.16)}
.st{display:grid;grid-template-columns:13rem minmax(0,1fr) auto;gap:clamp(1rem,2.5vw,2rem);
  align-items:center;background:linear-gradient(90deg,rgba(20,19,22,.9),rgba(13,12,15,.9));
  padding:clamp(.9rem,2vw,1.35rem);text-decoration:none;transition:background .5s var(--ease)}
.st:hover{background:linear-gradient(90deg,rgba(32,28,24,.95),rgba(18,16,19,.95))}
.st .plate{clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),
  calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.st .plate img{aspect-ratio:16/10}
.st .plate-fr{inset:6px}
.st-txt h3{font-family:var(--display);font-weight:500;font-size:clamp(1.1rem,2.3vw,1.6rem);
  line-height:1.14;margin:.35rem 0 .4rem;transition:color .4s}
.st-txt p{font-family:var(--display);font-style:italic;color:#948A76;font-size:.98rem;margin:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .go{font-size:1.4rem;color:var(--gold);opacity:.55;transition:transform .5s var(--ease),opacity .4s}
.st:hover .go{transform:translateX(7px);opacity:1}
@media (max-width:700px){
  .st{grid-template-columns:5.5rem minmax(0,1fr);gap:1rem}
  .st .go{display:none}
  .st .plate img{aspect-ratio:1}
}

.allbtn{display:block;width:max-content;margin:clamp(2.5rem,6vh,4rem) auto 0;
  padding:.95rem 2.6rem;border:1px solid rgba(201,162,39,.42);
  font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold-lt);text-decoration:none;background:none;
  cursor:pointer;position:relative;overflow:hidden;transition:color .45s}
.allbtn span{position:relative;z-index:2}
.allbtn::before{content:"";position:absolute;inset:0;background:var(--leaf);
  transform:translateY(101%);transition:transform .5s var(--swing)}
.allbtn:hover{color:#15100A}
.allbtn:hover::before{transform:none}

/* --t drives the page-turn lighting; registering it lets the browser
   interpolate it, so the shadow sweeps instead of snapping. */
@property --t{ syntax:'<number>'; inherits:true; initial-value:0; }
.leaf.anim{transition:transform .78s var(--swing), --t .78s var(--swing)}

/* your logo, when supplied */
.logo-mark{display:inline-block;background:var(--leaf);
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo-mark img,.logo-img{height:inherit;width:auto;display:block}
.logo-mark img{opacity:0;height:100%}
.flip .logo-mark,.flip .logo-img{transform:scaleX(-1)}
.logo-big{display:flex;justify-content:center;margin:0 auto .35rem}
#brand .logo-mark,#brand .logo-img{height:clamp(2.2rem,4vw,3.1rem)}

/* keep the header block on page one from inheriting the body indent */
.pg-body>.pg-kick,.pg-body>.pg-title,.pg-body>.pg-fl,
.pg-body>.pg-dek,.pg-body>.pg-by,.pg-body>.pg-imgwrap{text-indent:0}

</style>

<style>
/* ══════════════════════ 7 · PARCHMENT ══════════════════════ */
.paper{
  position:relative;color:var(--sepia);font-family:var(--body);
  background:
    radial-gradient(58% 42% at 22% 16%,rgba(163,132,74,.13),transparent 62%),
    radial-gradient(50% 40% at 82% 66%,rgba(150,118,64,.12),transparent 62%),
    radial-gradient(70% 46% at 50% 104%,rgba(112,86,44,.20),transparent 72%),
    linear-gradient(176deg,#F3E9D0 0%,#E9DCBD 34%,#DFCFAB 70%,#D3C09A 100%);
}
.paper::before{
  content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:var(--paper-tex,none);background-size:340px 340px;background-repeat:repeat}
.paper::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(118% 88% at 50% 44%,transparent 46%,rgba(120,94,52,.22) 100%)}

/* ══════════════════════ 8 · THE BOOK ══════════════════════ */
.stage{position:relative;padding:clamp(.5rem,1.5vh,1.5rem) var(--gut) clamp(1.5rem,3.5vh,3rem);
  display:flex;flex-direction:column;align-items:center}
.book{position:relative;perspective:2800px;perspective-origin:50% 42%;
  transform-style:preserve-3d;transition:transform .6s var(--ease)}
.book-shell{position:absolute;inset:-14px -18px -20px;border-radius:5px;z-index:0;
  background:linear-gradient(158deg,#33251A 0%,#241A11 42%,#15100A 100%);
  box-shadow:0 44px 90px rgba(0,0,0,.78),0 6px 20px rgba(0,0,0,.6),
             inset 0 0 46px rgba(0,0,0,.55),inset 0 1px 0 rgba(201,162,39,.16)}
.book-shell::after{content:"";position:absolute;inset:6px;border:1px solid rgba(201,162,39,.2);border-radius:3px}
.pages{position:relative;transform-style:preserve-3d}
.base{position:absolute;top:0;height:100%;width:var(--pw);overflow:hidden;z-index:0}
.base.l{left:0}.base.r{right:0}
.spine{position:absolute;left:50%;top:0;bottom:0;width:64px;transform:translateX(-50%);
  z-index:40;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(48,34,18,.5) 34%,rgba(24,16,8,.62) 50%,rgba(48,34,18,.5) 66%,transparent)}
.book.single .spine,.book.single .base.l{display:none}

.leaf{position:absolute;top:0;right:0;width:var(--pw);height:100%;
  transform-origin:left center;transform-style:preserve-3d;--t:0;
  will-change:transform}
.leaf.anim{transition:transform .78s var(--swing), --t .78s var(--swing)}
.side{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;
  -webkit-backface-visibility:hidden}
.side.f{transform:translateZ(.6px)}
.side.b{transform:rotateY(180deg) translateZ(.6px)}
.sheen,.gloss{position:absolute;inset:0;pointer-events:none;z-index:8}
.side.f .sheen{background:linear-gradient(to left,rgba(24,14,4,.62),transparent 44%);
  opacity:calc(var(--t) * .95)}
.side.b .sheen{background:linear-gradient(to right,rgba(24,14,4,.66),transparent 46%);
  opacity:calc((1 - var(--t)) * .95)}
.gloss{background:linear-gradient(to left,rgba(255,247,226,.34),transparent 26%);
  opacity:calc(var(--t) * (1 - var(--t)) * 3.4);mix-blend-mode:screen}
.side .edge{position:absolute;top:0;bottom:0;width:26px;pointer-events:none;z-index:7}
.side.f .edge{left:0;background:linear-gradient(to right,rgba(120,94,52,.34),transparent)}
.side.b .edge{right:0;background:linear-gradient(to left,rgba(120,94,52,.34),transparent)}
.book.single .side.f .edge,.book.single .side.b .edge{opacity:.4}

/* the corner you can grab */
.peel{position:absolute;right:0;bottom:0;width:clamp(3rem,6vw,4.75rem);aspect-ratio:1;
  z-index:12;cursor:grab;touch-action:none}
.peel::before{content:"";position:absolute;inset:0;
  background:linear-gradient(315deg,#CDB98D 0%,#E7DBBE 42%,#A89163 44%,transparent 45%);
  clip-path:polygon(100% 100%,0 100%,100% 0);
  transform:scale(.3);transform-origin:100% 100%;
  filter:drop-shadow(-4px -4px 7px rgba(0,0,0,.45));
  transition:transform .5s var(--ease)}
.leaf:hover .peel::before{transform:scale(.62)}
.peel:active{cursor:grabbing}
.dragging .leaf.anim{transition:none}

/* page content */
.pg{position:relative;width:100%;height:100%;overflow:hidden;
  padding:calc(2.6rem*var(--ps,1)) calc(2.7rem*var(--ps,1)) calc(3.4rem*var(--ps,1));
  display:flex;flex-direction:column}
.pg-body{flex:1;min-height:0;overflow:hidden;font-size:calc(1.06rem*var(--ps,1));line-height:1.66;
  text-align:justify;hyphens:auto}
.pg-body>*:first-child{margin-top:0}
.pg-foot{position:absolute;left:calc(2.7rem*var(--ps,1));right:calc(2.7rem*var(--ps,1));
  bottom:calc(1.5rem*var(--ps,1));display:flex;align-items:baseline;justify-content:space-between;
  gap:1rem;white-space:nowrap;font-family:var(--body);font-weight:500;
  font-size:calc(.66rem*var(--ps,1));letter-spacing:.22em;text-transform:uppercase;color:#8B7A5C}
.pg-foot::before{content:"";position:absolute;left:0;right:0;top:calc(-.9rem*var(--ps,1));
  height:1px;background:linear-gradient(to right,transparent,rgba(120,94,52,.35),transparent)}
.pg-foot .mid{opacity:.7}
.pg-foot button{background:none;border:0;cursor:pointer;color:inherit;font:inherit;
  letter-spacing:inherit;text-transform:inherit;padding:.2rem .1rem;transition:color .3s}
.pg-foot button:hover:not(:disabled){color:var(--crimson)}
.pg-foot button:disabled{opacity:.28;cursor:default}

/* first page furniture */
.pg-kick{display:flex;align-items:center;justify-content:center;gap:calc(.9rem*var(--ps,1));
  margin-bottom:calc(1rem*var(--ps,1))}
.pg-kick .ln{width:calc(2.4rem*var(--ps,1));height:1px;background:rgba(120,94,52,.5)}
.pg-kick span{font-family:var(--body);font-weight:500;font-size:calc(.7rem*var(--ps,1));
  letter-spacing:.3em;text-transform:uppercase;color:#8B7A5C}
.pg-title{font-family:var(--display);font-weight:500;color:#241E15;
  font-size:calc(2.05rem*var(--ps,1));line-height:1.08;text-align:center;
  margin:0 0 calc(.7rem*var(--ps,1));text-wrap:balance;letter-spacing:.005em}
.pg-fl{width:58%;margin:0 auto calc(.8rem*var(--ps,1));color:#8B6F3C}
.pg-dek{font-family:var(--display);font-style:italic;text-align:center;color:#5F5340;
  font-size:calc(1.02rem*var(--ps,1));margin:0 0 calc(.5rem*var(--ps,1))}
.pg-by{font-family:var(--body);font-weight:500;font-size:calc(.66rem*var(--ps,1));letter-spacing:.26em;
  text-transform:uppercase;text-align:center;color:#8B7A5C;margin:0 0 calc(1.2rem*var(--ps,1))}
.pg-img{width:100%;aspect-ratio:16/9;object-fit:cover;margin:0 0 1.1rem;
  filter:saturate(.66) contrast(1.08) brightness(.94) sepia(.14);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),
    calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px)}
.pg-imgwrap{position:relative;margin-bottom:1.1rem}
.pg-imgwrap .pg-img{margin:0}
.pg-imgwrap::after{content:"";position:absolute;inset:7px;pointer-events:none;
  border:1px solid rgba(90,68,34,.4)}

/* body typography inside a page */
.pg-body p{margin:0 0 .85em;text-indent:1.3em}
.pg-body p:first-of-type,.pg-body p[data-cont]{text-indent:0}
.pg-body h2,.pg-body h3,.pg-body h4{font-family:var(--display);font-weight:500;color:#2A2318;
  text-align:center;margin:1.5em 0 .6em;text-indent:0}
.pg-body h2{font-size:1.32em}.pg-body h3,.pg-body h4{font-size:1.12em;letter-spacing:.06em}
.pg-body blockquote{margin:1.2em 1.4em;font-family:var(--display);font-style:italic;
  color:#4B4030;text-align:center;text-indent:0}
.pg-body blockquote p{text-indent:0;margin:0}
.pg-body ul,.pg-body ol{margin:0 0 .9em;padding-left:1.4em;text-indent:0}
.pg-body li{margin-bottom:.3em}
.pg-body a{color:var(--crimson);text-decoration-thickness:1px;text-underline-offset:2px}
.pg-body img{width:100%;margin:1em 0;filter:sepia(.18) saturate(.72) contrast(1.06)}
.pg-body figure{margin:1em 0;text-indent:0}
.pg-body figcaption{font-size:.82em;font-style:italic;text-align:center;color:#7E7059;margin-top:.4em}
.pg-body hr{border:0;height:18px;margin:1.6em auto;width:8rem;
  background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 18'><g fill='none' stroke='%238B6F3C' stroke-width='1.1' stroke-linecap='round'><path d='M8 9h62M130 9h62'/><path d='M86 9c-6 0-9-4-14-4s-7 4-3 6c3 1 6-1 5-3'/><path d='M114 9c6 0 9-4 14-4s7 4 3 6c-3 1-6-1-5-3'/></g><path fill='%238B6F3C' d='M100 4l5 5-5 5-5-5z'/></svg>")}
.dropcap{float:left;font-family:var(--display);font-weight:500;color:#3A2E1C;
  font-size:3.4em;line-height:.76;margin:.05em .09em 0 0}
.dc-word{font-variant:small-caps;letter-spacing:.05em}
.pg .sig{font-family:var(--sign);font-size:calc(2.6rem*var(--ps,1));line-height:1;color:#3A2E1C;
  text-align:right;margin:.6rem 0 0;text-indent:0}

/* turn controls under the book */
.turnbar{display:flex;align-items:center;justify-content:center;gap:clamp(1rem,3vw,2.5rem);
  margin-top:clamp(.9rem,2vh,1.4rem)}
.turnbtn{width:2.9rem;height:2.9rem;border:1px solid rgba(201,162,39,.35);background:none;
  color:var(--gold);cursor:pointer;border-radius:50%;display:grid;place-items:center;
  transition:.35s;font-size:1rem}
.turnbtn:hover:not(:disabled){background:rgba(201,162,39,.14);border-color:var(--gold);transform:scale(1.06)}
.turnbtn:disabled{opacity:.25;cursor:default}
.turnbar .count{font-family:var(--body);font-weight:500;font-size:.72rem;letter-spacing:.28em;
  text-transform:uppercase;color:var(--sepia-3);min-width:9rem;text-align:center}
.turnhint{text-align:center;margin-top:.6rem;font-family:var(--body);font-size:.72rem;
  letter-spacing:.2em;text-transform:uppercase;color:#6A6252;opacity:.75}

/* ══════════════════════ 10 · ARCHIVE ══════════════════════ */
.arch{border:1px solid rgba(201,162,39,.26);padding:clamp(1.5rem,4vw,3.25rem);
  background:linear-gradient(170deg,rgba(22,20,24,.82),rgba(11,10,13,.9));position:relative}
.arch::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,39,.12);pointer-events:none}
.arch h1{font-family:var(--display);font-weight:600;font-size:clamp(1.9rem,5vw,3.2rem);
  letter-spacing:.06em;text-align:center;margin:0 0 .5rem}
.arch-fl{width:min(17rem,64%);height:1.3rem;margin:0 auto clamp(1.75rem,4vh,2.75rem)}
.finder{display:flex;align-items:center;gap:1rem;max-width:42rem;margin:0 auto clamp(1.5rem,3.5vh,2.25rem);
  border-bottom:1px solid rgba(201,162,39,.3);padding:.35rem .25rem}
.finder input{flex:1;min-width:0;background:none;border:0;color:var(--parch);
  font-family:var(--display);font-size:clamp(1rem,2vw,1.35rem);padding:.35rem 0}
.finder input::placeholder{color:#6A6252;font-style:italic}
.finder input:focus{outline:none}
.finder .count{font-family:var(--body);font-weight:500;font-size:.68rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--sepia-3);white-space:nowrap}
.tagrow{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:clamp(1.75rem,4vh,2.5rem)}
.tag{font-family:var(--body);font-weight:500;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.4rem 1rem;border:1px solid rgba(201,162,39,.24);color:#A79C86;background:none;
  cursor:pointer;transition:.28s}
.tag:hover{border-color:var(--gold);color:var(--gold-lt)}
.tag[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:var(--cream)}

.rowlist{display:flex;flex-direction:column;gap:clamp(.85rem,2vw,1.35rem)}
.row{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:0;text-decoration:none;
  border:1px solid rgba(201,162,39,.2);overflow:hidden;
  transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .4s}
.row:hover{transform:translateY(-3px);border-color:rgba(201,162,39,.5);
  box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(201,162,39,.12)}
.row .shot{position:relative;overflow:hidden;background:var(--coal)}
.row .shot img{width:100%;height:100%;min-height:8.5rem;object-fit:cover;
  filter:saturate(.62) contrast(1.14) brightness(.78);transition:transform 1.2s var(--ease),filter .6s}
.row:hover .shot img{transform:scale(1.07);filter:saturate(.8) contrast(1.14) brightness(.92)}
.row .shot::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 55%,rgba(9,9,11,.45))}
.row .body{position:relative;padding:clamp(1rem,2.4vw,1.7rem) clamp(1.15rem,2.8vw,2.1rem);
  display:flex;flex-direction:column;justify-content:center;gap:.3rem;
  color:var(--sepia);
  background:linear-gradient(172deg,#F1E6CC 0%,#E6D8B7 46%,#D9C8A2 100%)}
.row .body::before{content:"";position:absolute;inset:0;pointer-events:none;
  mix-blend-mode:multiply;opacity:.5;background:var(--paper-tex,none) repeat;background-size:340px 340px}
.row .body::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 40%,transparent 52%,rgba(120,94,52,.2) 100%)}
.row .body>*{position:relative;z-index:2}
.row .body h3{font-family:var(--display);font-weight:600;color:#241E15;
  font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:1.14;margin:0;transition:color .35s}
.row:hover .body h3{color:var(--crimson)}
.row .body .meta{margin:.15rem 0 .25rem;color:#8B7A5C}
.row .body p{font-family:var(--display);font-style:italic;color:#5F5340;font-size:1rem;
  line-height:1.4;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .arrow{position:absolute;right:1.25rem;bottom:1rem;color:var(--crimson);opacity:.6;
  font-size:1.2rem;z-index:3;transition:transform .5s var(--ease),opacity .35s}
.row:hover .arrow{transform:translateX(7px);opacity:1}
@media (max-width:640px){
  .row{grid-template-columns:6.5rem minmax(0,1fr)}
  .row .shot img{min-height:100%}
  .row .arrow{display:none}
}
.pager{display:flex;align-items:center;justify-content:center;gap:.35rem;margin-top:clamp(2rem,5vh,3rem);
  font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.16em}
.pager button{min-width:2.2rem;height:2.2rem;padding:0 .6rem;border:0;background:none;cursor:pointer;
  color:#8B7F68;transition:.3s;position:relative}
.pager button:hover:not(:disabled){color:var(--gold-lt)}
.pager button[aria-current="true"]{color:var(--gold-pale)}
.pager button[aria-current="true"]::after{content:"";position:absolute;left:25%;right:25%;
  bottom:.25rem;height:1px;background:var(--gold)}
.pager button:disabled{opacity:.25;cursor:default}
.pager .dots{color:#5B5344;padding:0 .3rem}

/* ══════════════════════ 11 · CONTACT & FOOTER ══════════════════════ */
.contact{text-align:center;padding:clamp(4rem,12vh,9rem) 0}
.contact h1{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,6.5vw,4.4rem);
  margin:1.25rem 0 1rem;letter-spacing:.02em}
.contact p{font-family:var(--display);font-style:italic;color:#948A76;
  font-size:clamp(1rem,1.7vw,1.25rem);max-width:28rem;margin:0 auto 2.25rem}
.contact .mail{font-family:var(--display);font-size:clamp(1.15rem,3vw,2.05rem);
  text-decoration:none;border-bottom:1px solid rgba(201,162,39,.4);padding-bottom:.2em;
  transition:border-color .4s}
.contact .mail:hover{border-color:var(--gold)}

footer.foot{position:relative;z-index:2;border-top:1px solid rgba(201,162,39,.16);margin-top:auto}
.foot-in{max-width:78rem;margin:0 auto;padding:clamp(2rem,5vh,3.25rem) var(--gut);
  display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.foot-in p{margin:0;font-family:var(--body);font-weight:500;font-size:.7rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--sepia-3)}
.foot-in a{color:var(--sepia-3);text-decoration:none;transition:color .3s}
.foot-in a:hover{color:var(--gold-lt)}
.creed{text-align:center;padding:0 var(--gut) clamp(1.75rem,4vh,2.5rem);
  font-family:var(--body);font-weight:500;font-size:.68rem;letter-spacing:.32em;
  text-transform:uppercase;color:#4E4838}
.creed em{font-style:normal;color:var(--gold);opacity:.55;margin:0 .9rem}


/* ══════════════════════ KIT · BUTTONS ══════════════════════ */
.kb{display:inline-flex;align-items:center;gap:1.1rem;text-decoration:none;cursor:pointer;
  font-family:var(--body);font-weight:500;font-size:.78rem;letter-spacing:.26em;text-transform:uppercase;
  padding:.95rem 1.9rem;border:1px solid var(--gold);color:var(--gold-pale);background:none;
  position:relative;overflow:hidden;transition:color .4s}
.kb .ar{width:1.6rem;height:1px;background:currentColor;position:relative;transition:width .45s var(--ease)}
.kb .ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;
  border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}
.kb:hover .ar{width:2.4rem}
.kb::before{content:"";position:absolute;inset:0;background:var(--gold);
  transform:translateY(101%);transition:transform .45s var(--swing)}
.kb>*{position:relative;z-index:2}
.kb:hover{color:#17110A}
.kb:hover::before{transform:none}
.kb.fill{background:var(--gold);color:#17110A;border-color:var(--gold)}
.kb.fill::before{background:var(--gold-pale)}
.kb.crim{background:var(--crimson);border-color:var(--crimson);color:var(--cream)}
.kb.crim::before{background:var(--crimson-lt)}
.kb.crim:hover{color:#fff}
.kb.plain{border:0;padding:.5rem 0;color:var(--gold)}
.kb.plain::before{display:none}
.kb.plain:hover{color:var(--gold-pale)}

/* ══════════════════════ KIT · HOME ══════════════════════ */
.hero-in{position:relative;z-index:2;width:100%;max-width:74rem;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.hero-say{font-family:var(--display);font-weight:400;font-style:italic;
  font-size:clamp(1.9rem,5vw,4.1rem);line-height:1.22;color:var(--cream);
  margin:0 auto .9rem;max-width:19ch;text-wrap:balance;
  text-shadow:0 3px 30px rgba(6,6,8,.95),0 0 70px rgba(6,6,8,.7)}
.hero-name{font-family:var(--body);font-weight:500;font-size:clamp(.68rem,1.15vw,.82rem);
  letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin:0;opacity:.95}
.hero-orn{width:min(19rem,58vw);margin:clamp(1.1rem,3vh,1.9rem) auto clamp(1.4rem,3.5vh,2.2rem)}

.sec-head{display:flex;align-items:center;gap:1.5rem;margin-bottom:clamp(1.75rem,4vh,3rem)}
.sec-head .ln{flex:1;height:1px;background:linear-gradient(to right,transparent,rgba(200,169,106,.45),transparent)}
.sec-head h2{font-family:var(--body);font-weight:500;font-size:clamp(.82rem,1.5vw,.98rem);
  letter-spacing:.36em;text-transform:uppercase;margin:0;white-space:nowrap;color:var(--gold)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:clamp(1rem,2vw,1.6rem)}
.wcard{display:block;text-decoration:none;border:1px solid rgba(200,169,106,.22);
  background:linear-gradient(168deg,rgba(28,28,28,.9),rgba(13,13,13,.95));
  transition:transform .5s var(--ease),border-color .4s,box-shadow .5s var(--ease)}
.wcard:hover{transform:translateY(-5px);border-color:rgba(200,169,106,.6);
  box-shadow:0 20px 44px rgba(0,0,0,.7),0 0 0 1px rgba(200,169,106,.12)}
.wcard .shot{display:block;position:relative;overflow:hidden;background:var(--coal);margin:.6rem .6rem 0}
.wcard .shot{background:linear-gradient(150deg,#241C10,#0F0D0B)}
.wcard .shot::before{content:"";display:block;padding-top:62.5%}
.wcard .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:saturate(.62) contrast(1.16) brightness(.8);transition:transform 1.2s var(--ease),filter .6s,opacity .4s}
img[data-fallback]{opacity:0}
.wcard:hover .shot img{transform:scale(1.07);filter:saturate(.8) contrast(1.16) brightness(.94)}
.wcard .shot::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(13,13,13,.65),transparent 55%)}
.wcard .txt{display:block;padding:1rem 1.05rem 1.25rem}
.wcard .cat{display:flex;align-items:center;gap:.45rem;font-family:var(--body);font-weight:500;
  font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.wcard .cat img{width:.9rem;height:.9rem;object-fit:contain;opacity:.9}
.wcard h3{font-family:var(--display);font-weight:500;color:var(--cream);
  font-size:1.16rem;line-height:1.22;margin:0 0 .65rem;transition:color .35s}
.wcard:hover h3{color:var(--gold-lt)}
.wcard .meta{display:block;font-family:var(--body);font-weight:500;font-size:.66rem;letter-spacing:.2em;
  text-transform:uppercase;color:#8A7F68}

/* ══════════════════════ KIT · SEARCH & PAGINATION ══════════════════════ */
.kfind{display:flex;align-items:center;gap:.9rem;max-width:34rem;margin:0 auto clamp(1.5rem,3.5vh,2.25rem);
  border:1px solid rgba(200,169,106,.35);padding:.7rem 1.15rem;background:rgba(13,13,13,.6)}
.kfind input{flex:1;min-width:0;background:none;border:0;color:var(--parch);
  font-family:var(--body);font-size:1rem;letter-spacing:.04em;padding:.15rem 0}
.kfind input::placeholder{color:#7A7059}
.kfind input:focus{outline:none}
.kfind svg{width:1rem;height:1rem;fill:var(--gold);opacity:.8;flex:none}
.pager{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:clamp(2rem,5vh,3rem);
  font-family:var(--body);font-weight:500;font-size:.85rem;letter-spacing:.1em}
.pager button{min-width:2.3rem;height:2.3rem;padding:0 .55rem;border:1px solid transparent;
  background:none;cursor:pointer;color:#8A7F68;transition:.3s}
.pager button:hover:not(:disabled){color:var(--gold-pale)}
.pager button[aria-current="true"]{color:var(--gold-pale);border-color:var(--gold)}
.pager button[aria-current="true"]::after{display:none}
.pager button:disabled{opacity:.28;cursor:default}
.pager .dots{color:#5B5344;padding:0 .2rem}

/* ══════════════════════ KIT · FOOTER ══════════════════════ */

  { id:"s1", slug:"the-world-is-a-stage", status:"published", featured:false,
    publishedAt:"2026-07-18", tags:["reflections","society"],
    title:"The World Is a Stage, But the Play Is Poorly Cast",
    dek:"On truth, pretense, and the endless performance of men.",
    thumb:"assets/cover1.jpg",
    body:`The world is a stage, and yet how wretched the actors. Each struts and frets his hour upon it, believes himself profound, while uttering only rehearsed nothings. They wear their masks so long, they come to fancy them their faces.

I have conversed with emperors and beggars, and in both I have found the same disease — an infinite concern for what others think, and a most lamentable neglect of what is.

We build our reputations as children build sandcastles by the tide, and are astonished when the sea reclaims them. How strange that we should labour so hard to appear wise, generous, loyal — and yet so seldom trouble ourselves to be any of these things.

> Give me solitude, storms, and a mind unchained.

There, at least, deception ends — and one may be both bad, mad, and dangerous, and yet sincere.

## On the applause of strangers

I have watched men ruin themselves for a sound that lasts four seconds. The applause of a room is the cheapest currency in Europe, and the most eagerly counterfeited.

A man who needs an audience will eventually write for one, and a man who writes for an audience has already stopped writing.

## What remains when the house empties

Strip away the costume and there is either a person underneath or there is not. Most discover, rather late, which of the two they have been.

    body:`In the crowd we are agreeable, and therefore we are nothing. Agreement is the tax the timid pay for company.

I have never had a thought worth keeping in a room of more than three people. The mind, like the eye, requires distance to see anything whole.

Solitude is not loneliness. Loneliness is the wish for company; solitude is the discovery that you were company all along.

const mediaCache = new Map(), bodyCache = new Map();
async function getThumb(p){
  if(!p) return "";
  if(p.thumb) return p.thumb;
  if(!db || !p.hasThumb) return "";
  const k = p.id+":thumb";
  if(mediaCache.has(k)) return mediaCache.get(k);
  try{
    const d = await fb.getDoc(fb.doc(db,"posts",p.id,"media","thumb"));
    const v = d.exists()?d.data().data:"";
    mediaCache.set(k,v); return v;
  }catch(e){ return ""; }
}
async function getCover(p){

  if(p.image) return p.image;
  if(db && p.hasCover){

    if(mediaCache.has(k)) return mediaCache.get(k);
    try{
      const d = await fb.getDoc(fb.doc(db,"posts",p.id,"media","cover"));
      if(d.exists()){ mediaCache.set(k,d.data().data); return d.data().data; }
    }catch(e){}

}
async function getBody(p){

/* Markdown → HTML. WordPress content is already HTML and passes straight through. */
function md(src){
  const t = String(src||"");
  if(/<(p|div|h[1-6]|ul|ol|blockquote|figure|img|br)\b/i.test(t)) return t;
  const inline = s => esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
  const lines = t.replace(/\r/g,"").split("\n");
  let out=[], para=[], list=null;
  const fp=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const fl=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ fp(); fl(); continue; }
    if(/^(---|\*\*\*)\s*$/.test(l)){ fp(); fl(); out.push("<hr>"); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ fp(); fl();
      const lv=Math.min(m[1].length+1,4); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if((m=l.match(/^>\s?(.*)$/))){ fp(); fl(); out.push(`<blockquote><p>${inline(m[1])}</p></blockquote>`); continue; }
    if((m=l.match(/^\s*[-*+]\s+(.*)$/))){ fp(); if(list!=="ul"){ fl(); out.push("<ul>"); list="ul"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ fp(); if(list!=="ol"){ fl(); out.push("<ol>"); list="ol"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    fl(); para.push(l.trim());
  }
  fp(); fl(); return out.join("\n");
}

/* resize + compress in the browser, so uploads never need thinking about */
function processImage(file,maxW,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("Couldn't read that file."));
    r.onload=()=>{ const img=new Image();
      img.onerror=()=>rej(new Error("That file isn't an image we can open."));
      img.onload=()=>{
        const s=Math.min(1,maxW/img.width), c=document.createElement("canvas");
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let q=quality,out=c.toDataURL("image/jpeg",q);
        while(out.length>780000&&q>0.35){ q-=0.08; out=c.toDataURL("image/jpeg",q); }
        res(out); };
      img.src=r.result; };
    r.readAsDataURL(file);
  });
}

let io;
function observeRises(){
  io?.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),
    {rootMargin:"0px 0px -6% 0px"});
  document.querySelectorAll(".rise").forEach(el=>io.observe(el));
}

/* ══════════════════════════════════════════════════════════════════
   5 · THE BOOK
   The essay is measured into real pages, then bound into leaves.
   Each leaf carries two pages — front and back — and rotates about
   the spine. Lighting is driven by --t, the turn progress, so the
   paper darkens toward the fold and catches a highlight mid-turn.
   ══════════════════════════════════════════════════════════════════ */
const BOOK = { pages:[], leaves:[], turned:0, n:0, single:false, busy:false, post:null, ctx:null };

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function deckle(seed){
  let r = (Math.abs(seed)%9973)||7;
  const rnd = () => ((r = (r*9301+49297)%233280)/233280);
  const NX=46, NY=30, A=6, pts=[];
  const j = () => (rnd()*A).toFixed(1);
  for(let i=0;i<=NX;i++) pts.push(`calc(${(i/NX*100).toFixed(2)}%) calc(0% + ${j()}px)`);
  for(let i=1;i<=NY;i++) pts.push(`calc(100% - ${j()}px) calc(${(i/NY*100).toFixed(2)}%)`);
  for(let i=NX-1;i>=0;i--) pts.push(`calc(${(i/NX*100).toFixed(2)}%) calc(100% - ${j()}px)`);
  for(let i=NY-1;i>=1;i--) pts.push(`calc(0% + ${j()}px) calc(${(i/NY*100).toFixed(2)}%)`);
  return `polygon(${pts.join(",")})`;
}
const seedOf = id => { let h=0; const t=String(id||"x"); for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%9973; return h; };

/* ── measure the writing into pages that actually fit ── */
function buildPages(mBody, bodyHTML, headerHTML){
  const pages = [];
  const holder = document.createElement("div");
  holder.innerHTML = bodyHTML;
  const items = [...holder.childNodes]
    .filter(n => n.nodeType===1 || (n.nodeType===3 && n.textContent.trim()))
    .map(n => { if(n.nodeType===3){ const p=document.createElement("p"); p.textContent=n.textContent.trim(); return p; } return n; });

  const over = () => mBody.scrollHeight > mBody.clientHeight + 1;
  const forced = new WeakSet();

  mBody.innerHTML = headerHTML;
  if(over()){ pages.push(mBody.innerHTML); mBody.innerHTML = ""; }

  for(let i=0;i<items.length;i++){
    const node = items[i];
    mBody.appendChild(node);
    if(!over()) continue;
    mBody.removeChild(node);

    if(mBody.childNodes.length){
      pages.push(mBody.innerHTML);
      mBody.innerHTML = "";
      mBody.appendChild(node);
      if(!over()) continue;
      mBody.removeChild(node);
    }
    // the block alone is taller than a page — cut it
    if(forced.has(node)){ mBody.appendChild(node); continue; }
    const parts = splitNode(node, mBody);
    if(parts.length < 2){ forced.add(parts[0]); }
    items.splice(i, 1, ...parts);
    i--;
  }

  const sig = document.createElement("p");
  sig.className = "sig"; sig.textContent = "Byron";
  mBody.appendChild(sig);
  if(over()){ mBody.removeChild(sig); pages.push(mBody.innerHTML); mBody.innerHTML=""; mBody.appendChild(sig); }
  pages.push(mBody.innerHTML);
  mBody.innerHTML = "";
  return pages;
}

/* binary-search the longest run of words that still fits on an empty page */
function splitNode(node, mBody){
  const words = (node.textContent||"").split(/\s+/).filter(Boolean);
  if(words.length < 8) return [node];
  const probe = node.cloneNode(false);
  mBody.appendChild(probe);
  const fits = n => { probe.textContent = words.slice(0,n).join(" ");
    return mBody.scrollHeight <= mBody.clientHeight + 1; };
  let lo=1, hi=words.length, best=1;
  while(lo<=hi){ const mid=(lo+hi)>>1; if(fits(mid)){ best=mid; lo=mid+1; } else hi=mid-1; }
  mBody.removeChild(probe);
  if(best>=words.length) return [node];
  const a=node.cloneNode(false); a.textContent = words.slice(0,best).join(" ");
  const b=node.cloneNode(false); b.textContent = words.slice(best).join(" ");
  b.dataset.cont = "1";
  return [a,b];
}

/* ── the illuminated opening: drop cap plus a small-capped first word ── */
function illuminate(html){
  const d = document.createElement("div");
  d.innerHTML = html;
  const p = d.querySelector("p");
  if(!p) return html;
  const walk = document.createTreeWalker(p, NodeFilter.SHOW_TEXT);
  const t = walk.nextNode();
  if(!t || !t.textContent.trim()) return html;
  const m = t.textContent.match(/^(\s*)(\S)(\S*)(\s+)?/);
  if(!m) return html;
  const rest = t.textContent.slice(m[0].length);
  const frag = document.createDocumentFragment();
  const cap = document.createElement("span"); cap.className="dropcap"; cap.textContent=m[2];
  frag.appendChild(cap);
  if(m[3]){ const w=document.createElement("span"); w.className="dc-word"; w.textContent=m[3]; frag.appendChild(w); }
  frag.appendChild(document.createTextNode((m[4]||" ")+rest));
  t.replaceWith(frag);
  return d.innerHTML;
}

/* ══════════════ mounting ══════════════ */
async function mountEssay(){
  if(!pendingEssay) return;
  const { post, body, img } = pendingEssay;
  const stage = document.querySelector(".reader-stage");
  if(!stage) return;

  try{ await document.fonts.ready; }catch(e){}

  const pagesEl = $("#pages");
  const single = window.innerWidth < 900;
  const navW = single ? 0 : 2 * (Math.min(54, window.innerWidth*0.04) + 40);
  const wrapW = Math.max(280, (stage.clientWidth || window.innerWidth) - navW);
  const maxH = Math.max(420, window.innerHeight - 132);
  let pw = single ? Math.min(wrapW, 620) : Math.min(wrapW/2, 700);
  let ph = pw * 1.36;
  if(ph > maxH){ ph = maxH; pw = Math.min(pw, ph/1.12); }
  pw = Math.max(240, Math.round(pw)); ph = Math.round(ph);

  const book = $("#book");
  book.classList.toggle("single", single);
  pagesEl.style.setProperty("--pw", pw+"px");
  pagesEl.style.setProperty("--ps", (pw/470*readerSize).toFixed(3));   // everything on a page scales from this
  pagesEl.style.setProperty("--paper-tex", `url("${ART.paper}")`);
  pagesEl.style.width  = (single ? pw : pw*2) + "px";
  pagesEl.style.height = ph + "px";

  // an invisible page of exactly the right size, used only for measuring
  const meas = document.createElement("div");
  meas.className = "side f";
  meas.style.cssText = `position:absolute;left:-99999px;top:0;width:${pw}px;height:${ph}px;visibility:hidden`;
  meas.style.setProperty("--ps", (pw/470*readerSize).toFixed(3));
  meas.innerHTML = `<div class="pg paper"><div class="pg-body"></div></div>`;
  pagesEl.appendChild(meas);
  const mBody = meas.querySelector(".pg-body");

  let pages = buildPages(mBody, illuminate(md(body)), pageHead(post, img));
  meas.remove();
  if(pages.length % 2) pages.push("");           // books have even leaves

  BOOK.pages = pages;
  BOOK.n = Math.max(1, Math.ceil((pages.length-1)/2));
  BOOK.turned = 0;
  BOOK.single = single;
  BOOK.post = post;

  const total = pages.length;
  const foot = (n) => n%2 ? `<div class="pg-foot">
      <button data-turn="prev">&#8592; Previous</button>
      <img class="foot-orn" src="${esc(ART.ornLB)}" alt="" aria-hidden="true">
      <button data-turn="next">Next &#8594;</button>
    </div>` : `<div class="pg-foot one">
      <span class="mid">${esc(store.site.byline)}</span><span>${n} / ${total}</span>
    </div>`;
  const face = (n) => n>total || pages[n-1]===undefined ? "" :
    `<div class="pg paper"><div class="pg-body">${pages[n-1]}</div>${foot(n)}</div>`;

  // page 1 sits on the left of the opening spread, as a printed book does:
  // the static left page carries it, and leaf i carries pages 2i+2 / 2i+3.
  const lBase = pagesEl.querySelector(".base.l .pg");
  if(lBase) lBase.innerHTML = `<div class="pg-body">${pages[0]||""}</div>${foot(1)}`;
  pagesEl.querySelectorAll(".leaf").forEach(l=>l.remove());
  const frag = document.createDocumentFragment();
  BOOK.leaves = [];
  for(let i=0;i<BOOK.n;i++){
    const leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.dataset.i = i;
    leaf.innerHTML =
      `<div class="side f">${face(2*i+2)}<div class="edge"></div><div class="sheen"></div><div class="gloss"></div></div>
       <div class="side b">${face(2*i+3)}<div class="edge"></div><div class="sheen"></div><div class="gloss"></div></div>
       <div class="peel" title="Drag to turn the page"></div>`;
    frag.appendChild(leaf);
    BOOK.leaves.push(leaf);
  }
  pagesEl.appendChild(frag);
  BOOK.leaves.forEach(l=>setLeaf(l,0));
  zorder(); updateBookUI();
  wireTurning(pagesEl, pw);
  observeRises();
}

function setLeaf(leaf, deg){
  leaf.style.transform = `rotateY(${-deg}deg)`;
  leaf.style.setProperty("--t", (deg/180).toFixed(4));
}
function zorder(){
  BOOK.leaves.forEach((lf,i)=>{
    lf.style.zIndex = (i < BOOK.turned) ? (i+1) : (2*BOOK.n - i);
    lf.querySelector(".peel").style.display = (i === BOOK.turned) ? "" : "none";
  });
}
function updateBookUI(){
  const first = BOOK.turned*2 + 1;
  const c = $("#pcount");
  if(c) c.textContent = BOOK.single
    ? `${Math.min(first,BOOK.pages.length)} / ${BOOK.pages.length}`
    : `${first}–${Math.min(first+1,BOOK.pages.length)} / ${BOOK.pages.length}`;
  const pr = $("#rProg");
  if(pr) pr.style.width = ((BOOK.turned/Math.max(1,BOOK.n))*100).toFixed(1)+"%";
  const pv=$("#pPrev"), nx=$("#pNext");
  if(pv) pv.disabled = BOOK.turned<=0;
  if(nx) nx.disabled = BOOK.turned>=BOOK.n;
}

function goNext(){
  if(BOOK.busy || BOOK.turned >= BOOK.n) return;
  const lf = BOOK.leaves[BOOK.turned];
  BOOK.busy = true;
  lf.style.zIndex = 3*BOOK.n + 5;
  lf.classList.add("anim");
  requestAnimationFrame(()=>setLeaf(lf,180));
  setTimeout(()=>{ BOOK.turned++; BOOK.busy=false; lf.classList.remove("anim"); zorder(); updateBookUI(); }, 800);
}
function goPrev(){
  if(BOOK.busy || BOOK.turned <= 0) return;
  const lf = BOOK.leaves[BOOK.turned-1];
  BOOK.busy = true;
  lf.style.zIndex = 3*BOOK.n + 5;
  lf.classList.add("anim");
  requestAnimationFrame(()=>setLeaf(lf,0));
  setTimeout(()=>{ BOOK.turned--; BOOK.busy=false; lf.classList.remove("anim"); zorder(); updateBookUI(); }, 800);
}

/* drag the corner and the page follows your hand */
function wireTurning(pagesEl, pw){
  if(BOOK.ctx) BOOK.ctx.abort();
  BOOK.ctx = new AbortController();
  const sig = { signal: BOOK.ctx.signal };
  let drag = null;

  pagesEl.addEventListener("pointerdown", e=>{
    const peel = e.target.closest(".peel");
    if(!peel || BOOK.busy || BOOK.turned >= BOOK.n) return;
    const leaf = peel.closest(".leaf");
    if(+leaf.dataset.i !== BOOK.turned) return;
    e.preventDefault();
    peel.setPointerCapture(e.pointerId);
    const box = pagesEl.getBoundingClientRect();
    drag = { leaf, spineX: BOOK.single ? box.left : box.left + pw, t:0, moved:false };
    document.body.classList.add("dragging");
    leaf.classList.remove("anim");
    leaf.style.zIndex = 3*BOOK.n + 5;
  }, sig);

  pagesEl.addEventListener("pointermove", e=>{
    if(!drag) return;
    drag.moved = true;
    drag.t = clamp((1 - (e.clientX - drag.spineX)/pw)/2, 0, 1);
    setLeaf(drag.leaf, drag.t*180);
  }, sig);

  const end = () => {
    if(!drag) return;
    const { leaf, t, moved } = drag;
    drag = null;
    document.body.classList.remove("dragging");
    leaf.classList.add("anim");
    if(!moved || t > 0.42){
      BOOK.busy = true;
      requestAnimationFrame(()=>setLeaf(leaf,180));
      setTimeout(()=>{ BOOK.turned++; BOOK.busy=false; leaf.classList.remove("anim"); zorder(); updateBookUI(); }, 620);
    }else{
      requestAnimationFrame(()=>setLeaf(leaf,0));
      setTimeout(()=>{ leaf.classList.remove("anim"); zorder(); }, 620);
    }
  };
  pagesEl.addEventListener("pointerup", end, sig);
  pagesEl.addEventListener("pointercancel", end, sig);

  // swipe anywhere on the spread
  let sw = null;
  pagesEl.addEventListener("pointerdown", e=>{
    if(e.target.closest(".peel") || e.target.closest("a")) return;
    sw = { x:e.clientX, y:e.clientY, id:e.pointerId };
  }, sig);
  pagesEl.addEventListener("pointerup", e=>{
    if(!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    sw = null;
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.4){ dx < 0 ? goNext() : goPrev(); }
  }, sig);
}

    updatedAt:new Date().toISOString(), words:wordsIn(draft.body),
    search:(draft.title+" "+draft.dek+" "+draft.tags.join(" ")+" "+draft.publishedAt+" "+
            String(draft.body||"").replace(/<[^>]+>/g," ").slice(0,400)).toLowerCase().slice(0,500)
  };
  try{
    let id = draft.id;
    if(id) await setDoc(doc(db,"posts",id), payload, {merge:true});
    else { const ref = await addDoc(collection(db,"posts"), payload); id = ref.id; draft.id = id; }
    await setDoc(doc(db,"posts",id,"content","body"), { text: draft.body||"" });
    bodyCache.set(id, draft.body||"");
    if(!isURL && draft.thumb){ await setDoc(doc(db,"posts",id,"media","thumb"),{data:draft.thumb}); mediaCache.set(id+":thumb",draft.thumb); }
    if(draft._newFull){ await setDoc(doc(db,"posts",id,"media","cover"),{data:draft._newFull}); mediaCache.set(id+":cover",draft._newFull); draft._newFull=null; }
    // any decorative asset that fails to load hides itself rather than showing
// a broken-image placeholder
document.addEventListener("error", e=>{
  const el = e.target;
  if(el.tagName === "IMG" && !el.dataset.fallback){
    el.dataset.fallback = "1";
    el.style.visibility = "hidden";
  }
}, true);

await loadPosts(); toast(status==="published"?"Published":"Draft saved");
    draft = null; render();
  }catch(e){ console.error(e); toast("Couldn't save — check your Firestore rules"); }
}
async function deletePost(id){
  const p = store.posts.find(x=>x.id===id);
  if(!confirm(`Delete "${p?.title||"this story"}"? This can't be undone.`)) return;
  try{
    for(const sub of [["media","cover"],["media","thumb"],["content","body"]])
      await fb.deleteDoc(fb.doc(db,"posts",id,sub[0],sub[1])).catch(()=>{});
    await fb.deleteDoc(fb.doc(db,"posts",id));
    await loadPosts(); toast("Deleted"); render();
  }catch(e){ toast("Couldn't delete that"); }
}
async function bulkApply(){
  const action = document.getElementById("bulkAction").value;
  const ids = [...admin.sel];
  if(!action || !ids.length){ toast(ids.length?"Pick an action":"Select some stories first"); return; }
  if(action==="delete" && !confirm(`Delete ${ids.length} ${ids.length===1?"story":"stories"}? This can't be undone.`)) return;
  try{
    for(const id of ids){
      if(action==="delete"){
        for(const sub of [["media","cover"],["media","thumb"],["content","body"]])
          await fb.deleteDoc(fb.doc(db,"posts",id,sub[0],sub[1])).catch(()=>{});
        await fb.deleteDoc(fb.doc(db,"posts",id));
      } else await fb.setDoc(fb.doc(db,"posts",id),{status:action},{merge:true});
    }
    admin.sel.clear(); await loadPosts(); toast(`${ids.length} updated`); render();
  }catch(e){ console.error(e); toast("Couldn't finish that"); }
}
async function exportJSON(){
  toast("Gathering everything…");
  const posts = [];
  for(let i=0;i<store.posts.length;i++){
    const p = store.posts[i];
    const [body,thumb] = await Promise.all([getBody(p),getThumb(p)]);
    posts.push({ ...p, body, thumb, image: await getCover(p) });
    if(i%25===24) toast(`Gathering… ${i+1} of ${store.posts.length}`);
  }
  const blob = new Blob([JSON.stringify({site:store.site,posts},null,2)],{type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `badmad-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href); toast(`Backup downloaded · ${posts.length} stories`);
}

/* Import: a backup from here (JSON) or a WordPress export (Tools → Export, .xml) */
async function importFile(file){
  const text = await file.text();
  let posts;
  try{
    posts = /^\s*</.test(text) ? parseWXR(text)
          : (()=>{ const d=JSON.parse(text); return Array.isArray(d)?d:d.posts; })();
  }catch(e){ console.error(e); toast("Couldn't read that file"); return; }
  if(!Array.isArray(posts)||!posts.length){ toast("No stories found in that file"); return; }
  const drafts = posts.filter(p=>p.status!=="published").length;
  if(!confirm(`Import ${posts.length} stories (${posts.length-drafts} published, ${drafts} draft)?\n\nExisting stories aren't touched.`)) return;

  const existing = new Set(store.posts.map(p=>p.slug));
  let done=0, skipped=0;
  for(const raw of posts){
    const slug = raw.slug || slugify(raw.title||"untitled");
    if(existing.has(slug)){ skipped++; continue; }
    existing.add(slug);
    const body = raw.body||"";
    const isURL = /^https?:\/\//i.test(raw.thumb||"");
    try{
      const ref = await fb.addDoc(fb.collection(db,"posts"),{
        title:raw.title||"Untitled", slug, dek:raw.dek||"", tags:raw.tags||[],
        thumb:isURL?raw.thumb:"", hasThumb:!isURL&&!!raw.thumb, hasCover:false,
        status:raw.status==="published"?"published":"draft", featured:false,
        publishedAt:raw.publishedAt||new Date().toISOString().slice(0,10),
        updatedAt:new Date().toISOString(), words:wordsIn(body),
        search:((raw.title||"")+" "+(raw.dek||"")+" "+(raw.tags||[]).join(" ")+" "+(raw.publishedAt||"")+" "+
                body.replace(/<[^>]+>/g," ").slice(0,400)).toLowerCase().slice(0,500)
      });
      await fb.setDoc(fb.doc(db,"posts",ref.id,"content","body"),{text:body});
      if(!isURL && raw.thumb) await fb.setDoc(fb.doc(db,"posts",ref.id,"media","thumb"),{data:raw.thumb});
      done++;
      if(done%10===0) toast(`Imported ${done} of ${posts.length}…`);
    }catch(e){ console.error("failed on",raw.title,e); }
  }
  await loadPosts(); toast(`Imported ${done}${skipped?` · skipped ${skipped} already here`:""}`); render();
}
function parseWXR(xml){
  const doc = new DOMParser().parseFromString(xml,"text/xml");
  if(doc.querySelector("parsererror")) throw new Error("bad xml");
  const items = [...doc.querySelectorAll("item")];
  const get = (el,sel) => el.querySelector(sel)?.textContent?.trim() || "";
  const wp = (el,tag) => { const n=[...el.children].find(c=>c.nodeName==="wp:"+tag||c.localName===tag);
    return n?n.textContent.trim():""; };
  const media = {};
  for(const it of items){ if(wp(it,"post_type")==="attachment") media[wp(it,"post_id")] = wp(it,"attachment_url"); }
  const out = [];
  for(const it of items){
    const type = wp(it,"post_type");
    if(type!=="post" && type!=="page") continue;
    const st = wp(it,"status");
    if(st==="trash"||st==="auto-draft"||st==="inherit") continue;
    let thumbId="";
    for(const m of [...it.children].filter(c=>c.nodeName==="wp:postmeta"||c.localName==="postmeta"))
      if(wp(m,"meta_key")==="_thumbnail_id") thumbId = wp(m,"meta_value");
    let body="";
    for(const c of it.children) if(c.nodeName==="content:encoded"){ body=c.textContent||""; break; }
    let dek="";
    for(const c of it.children) if(c.nodeName==="excerpt:encoded"){ dek=(c.textContent||"").trim(); break; }
    dek = dek.replace(/<[^>]+>/g,"").trim().slice(0,180);
    let thumb = media[thumbId]||"";
    if(!thumb){ const m = body.match(/<img[^>]+src=["']([^"']+)["']/i); if(m) thumb = m[1]; }
    const date = (wp(it,"post_date")||"").slice(0,10);
    const tags = [...it.querySelectorAll("category")]
      .filter(c=>["post_tag","category"].includes(c.getAttribute("domain")))
      .map(c=>c.textContent.trim().toLowerCase()).filter(t=>t&&t!=="uncategorized");
    out.push({ title:get(it,"title"), slug:wp(it,"post_name")||slugify(get(it,"title")),
      dek, body:body.trim(), tags:[...new Set(tags)].slice(0,6), thumb,
      status: st==="publish"?"published":"draft",
      publishedAt: /^\d{4}-\d{2}-\d{2}$/.test(date)?date:new Date().toISOString().slice(0,10) });
  }
  return out;
}
async function saveSettings(){
  const t = prompt("Site title", store.site.title); if(t===null) return;
  const b = prompt("The line on the home page", store.site.bio); if(b===null) return;
  const y = prompt("Your name", store.site.byline); if(y===null) return;
  const e = prompt("Contact email", store.site.email); if(e===null) return;
  store.site = { title:t, bio:b, byline:y, email:e };
  try{ await fb.setDoc(fb.doc(db,"settings","site"), store.site, {merge:true}); toast("Site details saved"); render(); }
  catch(err){ toast("Couldn't save site details"); }
}
function wrapSel(kind){
  const ta = document.getElementById("bodyInput");
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s,e);
  const map = { h2:["\n## ","\n"], b:["**","**"], i:["*","*"], q:["\n> ","\n"],
    ul:["\n- ","\n"], link:["[","](https://)"], hr:["\n\n---\n\n",""] };
  const [a,z] = map[kind];
  ta.value = ta.value.slice(0,s)+a+sel+z+ta.value.slice(e);
  ta.focus(); ta.selectionStart = s+a.length; ta.selectionEnd = s+a.length+sel.length;
}
function bindEditor(){
  const ta = document.getElementById("bodyInput");
  document.querySelectorAll(".mdbar [data-md]").forEach(b=>b.onclick=()=>wrapSel(b.dataset.md));
  document.getElementById("previewToggle").onclick = e=>{
    const pane = document.getElementById("previewPane"), on = pane.style.display==="none";
    pane.style.display = on?"block":"none"; ta.style.display = on?"none":"block";
    e.target.textContent = on?"Write":"Preview";
    if(on) pane.innerHTML = illuminate(md(ta.value));
  };
  const ti = document.getElementById("titleInput"), si = document.getElementById("slugInput");
  ti.oninput = ()=>{ if(!draft.id && !si.dataset.touched) si.value = slugify(ti.value); };
  si.oninput = ()=> si.dataset.touched = "1";
  const drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = ()=>file.click();
  drop.ondragover = e=>{ e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = ()=>drop.classList.remove("over");
  drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove("over"); takeImage(e.dataTransfer.files[0]); };
  file.onchange = ()=>takeImage(file.files[0]);
  const rm = document.getElementById("removeImg");
  if(rm) rm.onclick = ()=>{ collectDraft(); draft.thumb=""; draft._newFull=null; render(); };
}
async function takeImage(f){
  if(!f) return;
  if(!f.type.startsWith("image/")){ toast("That's not an image"); return; }
  toast("Processing image…");
  try{
    collectDraft();
    draft.thumb = await processImage(f, 1100, 0.76);
    draft._newFull = await processImage(f, 2000, 0.86);
    render();
  }catch(e){ toast(e.message); }
}

/* the nav mirrors the mockup: a few categories, then Archive and Contact.
   Categories come from your own tags, commonest first. */
function buildNav(r){
  const counts = {};
  for(const p of published()) for(const t of (p.tags||[])) counts[t] = (counts[t]||0)+1;
  const cats = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]);
  const cur = r.name==="archive" ? (r.arg||"") : null;
  const nav = $("#nav");
  nav.innerHTML =
    `<a href="#/"${r.name==="home"?' aria-current="page"':""}>Home</a>` +
    cats.map(t=>`<a href="#/archive/${encodeURIComponent(t)}"${cur===t?' aria-current="page"':""}>${esc(t)}</a>`).join("") +
    `<a href="#/archive"${r.name==="archive"&&!cur?' aria-current="page"':""}>Archive</a>` +
    `<a href="#/contact"${r.name==="contact"?' aria-current="page"':""}>Contact</a>`;
}

function closeQuietly(){
  const el = document.querySelector(".reader");
  if(el){ el.remove(); document.body.style.overflow=""; }
  if(BOOK.ctx){ BOOK.ctx.abort(); BOOK.ctx=null; }
  BOOK.leaves = [];
}
function route(){
  const parts = (location.hash.replace(/^#/,"")||"/").split("/").filter(Boolean);
  return { name: parts[0]||"home", arg: parts[1]||"" };
}
async function render(){
  const r = route(), app = $("#app");
  pendingEssay = null;
  if(BOOK.ctx){ BOOK.ctx.abort(); BOOK.ctx = null; }
  if(!store.loaded) await loadPosts();

  if(r.name==="archive"){
    const want = r.arg ? decodeURIComponent(r.arg) : "";
    if(want !== arch.tag){ arch.tag = want; arch.page = 1; }
    app.innerHTML = viewArchive();
  }
  else if(r.name==="essay")   app.innerHTML = viewHome();
  else if(r.name==="contact") app.innerHTML = viewContact();
  else if(r.name==="studio")  app.innerHTML = viewStudio();
  else                        app.innerHTML = viewHome();

  $("#footLeft").textContent = store.site.title.toUpperCase();
  $("#footBy").textContent = "BY " + store.site.byline.toUpperCase();
  $("#footYear").textContent = new Date().getFullYear();
  $("#footMail").href = "mailto:" + store.site.email;
  const counts = {};
  for(const q of published()) for(const tg of (q.tags||[])) counts[tg]=(counts[tg]||0)+1;
  $("#footNav").innerHTML =
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([t])=>`<a href="#/archive/${encodeURIComponent(t)}">${esc(t)}</a>`).join("") +
    `<a href="#/archive">Archive</a><a href="#/contact">About</a>`;
  document.title = r.name==="essay"
    ? `${(store.posts.find(p=>p.slug===r.arg)||{}).title||"Story"} — ${store.site.title}`
    : store.site.title;
  buildNav(r);

  if(r.name==="archive") renderArchive();
  if(r.name==="studio" && draft) bindEditor();
  if(r.name==="essay") await openReader(r.arg); else closeQuietly();
  hydrateThumbs(); observeRises(); seedMotes();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ══════════════════════════════════════════════════════════════════

document.addEventListener("click", async e=>{
  const t = e.target.closest("button, .tag, .wp-counts a, th[data-sort]");
  if(!t) return;
  if(t.tagName==="TH" || t.closest(".wp-counts")) e.preventDefault();

  // reading
  if(t.dataset.turn){ t.dataset.turn==="next" ? goNext() : goPrev(); return; }
  if(t.id==="pNext") goNext();
  if(t.id==="pPrev") goPrev();
  if(t.id==="rClose"){ closeReader(); return; }
  if(t.id==="rCandle"){ readerCandle=!readerCandle; document.querySelector(".reader")?.classList.toggle("candle",readerCandle); return; }
  if(t.dataset.size){
    readerSize = Math.min(1.28, Math.max(.82, readerSize + (+t.dataset.size)*0.09));
    if(pendingEssay) mountEssay();
    return;
  }
  if(t.dataset.share){
    const url = location.href, title = document.title;
    const to = { x:`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`,
                 fb:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`,
                 mail:`mailto:?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(url)}` }[t.dataset.share];
    window.open(to,"_blank","noopener,width=620,height=520");
  }

  // archive
  if(t.dataset.apage!==undefined){ arch.page = Math.max(1,+t.dataset.apage); renderArchive();
    document.querySelector(".arch")?.scrollIntoView({behavior:"smooth",block:"start"}); }
  if(t.classList.contains("tag")){
    arch.tag = t.dataset.tag; arch.page = 1;
    history.replaceState(null,"", arch.tag ? `#/archive/${encodeURIComponent(arch.tag)}` : "#/archive");
    document.querySelectorAll(".tag").forEach(x=>x.setAttribute("aria-pressed", x.dataset.tag===arch.tag));
    renderArchive();
  }

  // studio
  if(t.id==="loginBtn"){
    try{ await fb.signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); }
    catch(err){ $("#loginErr").textContent = "That email and password don't match."; }
  }
  if(t.id==="signout") await fb.signOut(auth);
  if(t.id==="newBtn"){ draft = blankPost(); render(); }
  if(t.dataset.edit){
    const src = store.posts.find(p=>p.id===t.dataset.edit);
    if(src){ const [body,thumb] = await Promise.all([getBody(src),getThumb(src)]);
      draft = { ...src, body, thumb }; render(); }
  }
  if(t.dataset.del) deletePost(t.dataset.del);
  if(t.id==="backBtn"){ draft=null; render(); }
  if(t.id==="saveDraft") savePost("draft");
  if(t.id==="publishBtn") savePost("published");
  if(t.id==="unpublishBtn") savePost("draft");
  if(t.id==="exportBtn") exportJSON();
  if(t.id==="importBtn") document.getElementById("importFile").click();
  if(t.id==="settingsBtn") saveSettings();
  if(t.id==="applyBulk") bulkApply();
  if(t.dataset.status!==undefined && t.closest(".wp-counts")){
    admin.status = t.dataset.status; admin.page = 1; admin.sel.clear(); render();
  }
  if(t.dataset.page!==undefined && t.closest(".wp-pager")){
    admin.page = Math.max(1, parseInt(t.dataset.page,10)||1); render();
  }
  if(t.dataset.sort){
    if(admin.sort===t.dataset.sort) admin.dir = admin.dir==="asc"?"desc":"asc";
    else { admin.sort = t.dataset.sort; admin.dir = t.dataset.sort==="title"?"asc":"desc"; }
    admin.page = 1; render();
  }
});

document.addEventListener("change", e=>{
  const el = e.target;
  if(el.id==="importFile" && el.files[0]){ importFile(el.files[0]); el.value=""; }
  if(el.id==="yearFilter"){ admin.year = el.value; admin.page=1; render(); }
  if(el.id==="tagFilter"){ admin.tag = el.value; admin.page=1; render(); }
  if(el.id==="selAll"){
    document.querySelectorAll("[data-sel]").forEach(cb=>{
      cb.checked = el.checked;
      el.checked ? admin.sel.add(cb.dataset.sel) : admin.sel.delete(cb.dataset.sel);
    });
  }
  if(el.dataset.sel!==undefined) el.checked ? admin.sel.add(el.dataset.sel) : admin.sel.delete(el.dataset.sel);
});

let searchTimer;
document.addEventListener("input", e=>{

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && document.querySelector(".reader")){ closeReader(); return; }
  if((e.metaKey||e.ctrlKey) && e.key==="s" && draft){ e.preventDefault(); savePost(draft.status||"draft"); return; }
  if(e.target.id==="pageBox" && e.key==="Enter"){ admin.page = Math.max(1,parseInt(e.target.value,10)||1); render(); return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(document.querySelector(".reader") && BOOK.leaves.length){
    if(e.key==="ArrowRight"){ e.preventDefault(); goNext(); }
    if(e.key==="ArrowLeft"){ e.preventDefault(); goPrev(); }
  }
});

let resizeTimer;
window.addEventListener("resize", ()=>{

  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ if(pendingEssay) mountEssay(); }, 260);
});

window.addEventListener("hashchange", ()=>{ if(route().name!=="studio") draft = null; render(); });

if(auth) fb.onAuthStateChanged(auth, async u=>{
  store.user = (u && u.email===CFG.editorEmail) ? u : null;
  if(u && u.email!==CFG.editorEmail){ await fb.signOut(auth); toast("That account can't edit this site"); }
  if(route().name==="studio") render();

if(!LIVE) SAMPLES.forEach(p=>{ p.words = String(p.body||"").split(/\s+/).filter(Boolean).length; });
await loadPosts();

if(LOGO.src){
  const b = document.querySelector("#brand");

  if(bt) bt.innerHTML = `<b>${esc(store.site.title).toUpperCase()}</b><span>BY ${esc(store.site.byline).toUpperCase()}</span>`;
}

render();

<style>
/* ════════════════════════════ TOKENS ════════════════════════════ */
:root{
  --ink:#14100E;          /* iron-gall black, warm */
  --ink-2:#1D1714;        /* raised surface */
  --ink-3:#2A211C;        /* hairline on dark */
  --paper:#EDE3D3;        /* foxed cream */
  --paper-2:#E2D6C2;
  --muted:#9A8B79;
  --claret:#8E1F2B;
  --claret-lt:#B23A44;
  --brass:#B08C3F;

  --bg:var(--ink);
  --fg:var(--paper);
  --dim:var(--muted);
  --rule:var(--ink-3);
  --surface:var(--ink-2);

  --display:"Bodoni Moda",Georgia,serif;
  --read:"Newsreader",Georgia,serif;
  --util:"Archivo",system-ui,sans-serif;

  --gut:clamp(1.25rem,5vw,5rem);
  --measure:38rem;
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* Interior of the book: essays and the studio turn the page to paper */
body[data-mode="paper"]{
  --bg:var(--paper);
  --fg:var(--ink);
  --dim:#6B5D4E;
  --rule:#CDBFA9;
  --surface:var(--paper-2);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--read);font-weight:300;font-size:1.0625rem;line-height:1.7;
  transition:background-color .7s var(--ease),color .7s var(--ease);
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--claret-lt);outline-offset:3px;border-radius:2px}

/* paper grain, everywhere, barely there */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:900;opacity:.5;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.28'/></svg>");
}

/* ════════════════════════════ TYPE ════════════════════════════ */
.eyebrow{
  font-family:var(--util);font-size:.6875rem;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
}
.display{font-family:var(--display);font-weight:400;line-height:.94;letter-spacing:-.015em}
.rule{height:1px;background:var(--rule);border:0;margin:0}

/* ════════════════════════════ CHROME ════════════════════════════ */
.masthead{
  position:sticky;top:0;z-index:800;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem var(--gut);
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--rule);
  transition:background-color .7s var(--ease),border-color .7s var(--ease);
}
.wordmark{
  font-family:var(--display);font-size:clamp(1rem,2.1vw,1.3rem);
  letter-spacing:.01em;text-decoration:none;white-space:nowrap;
}
.wordmark i{font-style:italic;color:var(--claret-lt)}
.nav{display:flex;gap:clamp(.9rem,2.4vw,2rem);align-items:center}
.nav a{
  font-family:var(--util);font-size:.7rem;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;text-decoration:none;color:var(--dim);
  padding-bottom:2px;border-bottom:1px solid transparent;transition:color .3s,border-color .3s;
}
.nav a:hover,.nav a[aria-current="page"]{color:var(--fg);border-color:var(--claret)}

/* ═══════════════════ SIGNATURE: the marbled field ═══════════════════ */
.marble{position:absolute;inset:-8%;z-index:0;pointer-events:none}
.marble svg{width:100%;height:100%;display:block}
.marble::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 68% 30%,transparent 0%,var(--ink) 78%);
}
@media (prefers-reduced-motion:reduce){.marble animate{display:none}}

/* ════════════════════════════ HERO ════════════════════════════ */
.hero{position:relative;isolation:isolate;overflow:hidden;border-bottom:1px solid var(--ink-3)}
.hero-in{
  position:relative;z-index:2;
  padding:clamp(3rem,9vh,7rem) var(--gut) clamp(3rem,8vh,6rem);
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:clamp(2rem,5vw,4.5rem);align-items:center;
  max-width:96rem;margin-inline:auto;min-height:66vh;
}
.hero-title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(2.9rem,8.4vw,7rem);line-height:.9;letter-spacing:-.02em;
  margin:.35em 0 .3em;
}
.hero-title a{text-decoration:none;background-image:linear-gradient(var(--claret),var(--claret));
  background-size:0% 1px;background-repeat:no-repeat;background-position:0 92%;
  transition:background-size .6s var(--ease)}
.hero-title a:hover{background-size:100% 1px}
.hero-dek{
  font-size:clamp(1.05rem,1.5vw,1.3rem);font-style:italic;color:var(--paper);
  opacity:.82;max-width:32rem;margin:0 0 1.6rem;
}
.hero-meta{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1.8rem}
.dot{width:3px;height:3px;background:var(--brass);border-radius:50%}

.plate{position:relative;transform:rotate(-1.1deg)}
.plate img{
  width:100%;aspect-ratio:4/5;object-fit:cover;
  filter:saturate(.86) contrast(1.05);
}
.plate::before{
  content:"";position:absolute;inset:-10px;border:1px solid rgba(176,140,63,.35);
  pointer-events:none;
}
.plate::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px rgba(20,16,14,.55);
}

.readlink{
  display:inline-flex;align-items:center;gap:.85rem;text-decoration:none;
  font-family:var(--util);font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
}
.readlink .line{display:block;width:2.6rem;height:1px;background:var(--claret-lt);transition:width .5s var(--ease)}
.readlink:hover .line{width:4.6rem}

/* ════════════════════ COLOPHON (the "about" strip) ════════════════════ */
.colophon{
  padding:clamp(2.5rem,6vh,4.5rem) var(--gut);
  border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(1.5rem,5vw,4rem);
  max-width:96rem;margin-inline:auto;align-items:start;
}
.colophon p{
  font-family:var(--display);font-size:clamp(1.25rem,2.6vw,2rem);line-height:1.28;
  font-weight:400;margin:0;max-width:40rem;
}
.colophon .sig{font-style:italic;color:var(--claret-lt);display:block;
  font-size:clamp(1rem,1.6vw,1.15rem);margin-top:1rem;font-family:var(--read)}

/* ════════════════════════ INDEX (contents page) ════════════════════════ */
.section{padding:clamp(3rem,8vh,6rem) var(--gut);max-width:96rem;margin-inline:auto}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding-bottom:1rem;border-bottom:1px solid var(--rule);margin-bottom:.5rem}
.section-head a{font-family:var(--util);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  text-decoration:none;color:var(--dim);transition:color .3s}
.section-head a:hover{color:var(--claret-lt)}

.entry{
  display:grid;grid-template-columns:6.5rem minmax(0,1fr) 5.5rem;
  gap:clamp(1rem,3vw,2.5rem);align-items:center;
  padding:clamp(1.4rem,3vw,2.2rem) 0;border-bottom:1px solid var(--rule);
  text-decoration:none;position:relative;
}
.entry:hover .entry-title{color:var(--claret-lt)}
.entry-date{font-family:var(--util);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.entry-title{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.05;
  margin:0 0 .3rem;transition:color .35s}
.entry-dek{color:var(--dim);font-size:.95rem;font-style:italic;margin:0;max-width:34rem}
.entry-thumb{width:5.5rem;height:6.8rem;object-fit:cover;
  opacity:0;transform:translateY(10px) rotate(2deg);
  transition:opacity .5s var(--ease),transform .5s var(--ease);justify-self:end}
.entry:hover .entry-thumb,.entry:focus-visible .entry-thumb{opacity:.95;transform:none}

/* ════════════════════════════ ARCHIVE GRID ════════════════════════════ */
.searchbar{display:flex;gap:.75rem;align-items:center;border-bottom:1px solid var(--rule);
  padding:.6rem 0;margin-bottom:2.5rem}
.searchbar input{
  flex:1;background:none;border:0;color:var(--fg);font-family:var(--read);
  font-size:1.15rem;padding:.4rem 0;
}
.searchbar input::placeholder{color:var(--dim);font-style:italic}
.searchbar input:focus{outline:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));
  gap:clamp(1.5rem,3.5vw,3rem) clamp(1.25rem,2.5vw,2.25rem)}
.card{text-decoration:none;display:block}
.card-img{position:relative;overflow:hidden;margin-bottom:1rem}
.card-img img{width:100%;aspect-ratio:3/4;object-fit:cover;
  transition:transform 1.1s var(--ease),filter .6s;filter:saturate(.8) contrast(1.04)}
.card:hover .card-img img{transform:scale(1.045);filter:saturate(1) contrast(1.04)}
.card-title{font-family:var(--display);font-size:1.35rem;line-height:1.12;margin:.4rem 0 .35rem}
.card-dek{color:var(--dim);font-size:.9rem;font-style:italic;margin:0}
.tagrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2rem}
.tag{
  font-family:var(--util);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;
  padding:.35rem .7rem;border:1px solid var(--rule);border-radius:99px;color:var(--dim);
  cursor:pointer;background:none;transition:.3s
}
.tag:hover{border-color:var(--claret);color:var(--fg)}
.tag[aria-pressed="true"]{background:var(--claret);border-color:var(--claret);color:#F6EFE4}

/* ════════════════════════════ ESSAY ════════════════════════════ */
.essay-hero{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.essay-hero img{width:100%;height:min(58vh,34rem);object-fit:cover;filter:saturate(.82)}
.essay-head{max-width:var(--measure);margin:clamp(2.5rem,7vh,5rem) auto clamp(1.5rem,4vh,2.5rem);
  padding:0 var(--gut);text-align:center}
.essay-title{font-family:var(--display);font-weight:400;
  font-size:clamp(2.3rem,6.5vw,4.4rem);line-height:.98;letter-spacing:-.02em;margin:.4em 0 .35em}
.essay-dek{font-style:italic;font-size:1.2rem;color:var(--dim);margin:0 auto 1.5rem;max-width:30rem}
.essay-body{max-width:var(--measure);margin:0 auto;padding:0 var(--gut) clamp(4rem,10vh,7rem);
  font-size:1.185rem;line-height:1.78}
.essay-body>p:first-of-type::first-letter{
  float:left;font-family:var(--display);font-size:4.6em;line-height:.78;
  padding:.06em .1em 0 0;color:var(--claret);font-weight:400;
}
.essay-body p{margin:0 0 1.35em}
.essay-body h2{font-family:var(--display);font-size:1.9rem;line-height:1.15;margin:2.4em 0 .6em;font-weight:400}
.essay-body h3{font-family:var(--util);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;
  margin:2.4em 0 .8em;color:var(--dim);font-weight:600}
.essay-body blockquote{
  margin:2em 0;padding-left:1.6rem;border-left:2px solid var(--claret);
  font-family:var(--display);font-size:1.35rem;line-height:1.35;font-style:italic;
}
.essay-body blockquote p{margin:0}
.essay-body img{margin:2.2em 0;width:100%}
.essay-body ul,.essay-body ol{padding-left:1.3rem;margin:0 0 1.35em}
.essay-body li{margin-bottom:.5em}
.essay-body a{color:var(--claret);text-decoration-thickness:1px;text-underline-offset:3px}
.essay-body hr{border:0;height:1px;background:var(--rule);margin:3em auto;width:6rem}
.essay-body code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--surface);padding:.1em .35em}
.essay-foot{max-width:var(--measure);margin:0 auto;padding:0 var(--gut) clamp(4rem,10vh,7rem)}

/* ════════════════════════════ CONTACT ════════════════════════════ */
.contact{max-width:46rem;margin-inline:auto;padding:clamp(4rem,12vh,8rem) var(--gut);text-align:center}
.contact h1{font-family:var(--display);font-size:clamp(2.4rem,7vw,4.5rem);line-height:1;margin:.3em 0 .5em;font-weight:400}
.contact a.mail{font-family:var(--display);font-size:clamp(1.1rem,3vw,1.8rem);color:var(--claret-lt);
  text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:.15em}

/* ════════════════════════════ FOOTER ════════════════════════════ */
.foot{border-top:1px solid var(--rule);padding:clamp(2.5rem,6vh,4rem) var(--gut);
  display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;align-items:end;
  max-width:96rem;margin-inline:auto}
.foot p{margin:0;font-family:var(--util);font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim)}
.foot a{color:var(--dim);text-decoration:none}
.foot a:hover{color:var(--claret-lt)}

/* ════════════════════════ REVEAL ON SCROLL ════════════════════════ */
.rise{opacity:0;transform:translateY(18px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rise.in{opacity:1;transform:none}

/* ══════════════════ OPENING SEQUENCE (the book falls open) ══════════════════ */
@keyframes inkspread{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes lift{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes plate-in{from{opacity:0;transform:rotate(-4deg) translateY(30px)}
                    to{opacity:1;transform:rotate(-1.1deg)}}
.hero .marble{animation:inkspread 2.6s var(--ease) both}
.hero-in > div > *{animation:lift .95s var(--ease) both}
.hero-in > div > *:nth-child(1){animation-delay:.35s}
.hero-in > div > *:nth-child(2){animation-delay:.45s}
.hero-in > div > *:nth-child(3){animation-delay:.55s}
.hero-in > div > *:nth-child(4){animation-delay:.65s}
.hero-in > div > *:nth-child(5){animation-delay:.75s}
.hero-in .plate{animation:plate-in 1.3s var(--ease) both;animation-delay:.5s}

@media (prefers-reduced-motion:reduce){
  .rise{opacity:1;transform:none;transition:none}
  .hero .marble,.hero-in > div > *,.hero-in .plate{animation:none}
  *{scroll-behavior:auto!important}
}

/* ════════════════════════════ STUDIO ════════════════════════════ */
.studio{max-width:74rem;margin-inline:auto;padding:clamp(2rem,5vh,3.5rem) var(--gut) 6rem}
.studio h1{font-family:var(--display);font-size:clamp(2rem,5vw,3rem);font-weight:400;margin:0 0 .2em}
.studio-bar{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);padding-bottom:1.25rem;margin-bottom:2rem}
.btn{
  font-family:var(--util);font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding:.7rem 1.2rem;border:1px solid var(--rule);background:none;cursor:pointer;
  transition:.25s;white-space:nowrap;border-radius:2px;text-decoration:none;display:inline-block
}
.btn:hover{border-color:var(--claret);color:var(--claret)}
.btn.primary{background:var(--claret);border-color:var(--claret);color:#F6EFE4}
.btn.primary:hover{background:var(--claret-lt);border-color:var(--claret-lt);color:#fff}
.btn.ghost{border-color:transparent;color:var(--dim);padding-inline:.5rem}
.btn.ghost:hover{color:var(--claret)}
.btn.danger:hover{border-color:var(--claret);color:var(--claret)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

.field{margin-bottom:1.4rem}
.field label{display:block;font-family:var(--util);font-size:.66rem;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem}
.field input,.field textarea,.field select{
  width:100%;background:var(--surface);border:1px solid var(--rule);color:var(--fg);
  font-family:var(--read);font-size:1rem;padding:.75rem .9rem;border-radius:2px
}
.field textarea{min-height:9rem;resize:vertical;line-height:1.65}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--claret)}
.field .hint{font-size:.82rem;color:var(--dim);margin:.45rem 0 0;font-style:italic}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem}

.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:clamp(1.5rem,3vw,2.5rem);align-items:start}
.panel{border:1px solid var(--rule);padding:1.4rem;border-radius:3px;background:var(--surface)}
.panel h3{font-family:var(--util);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:0 0 1rem;font-weight:600}

.mdbar{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.mdbar button{font-family:var(--util);font-size:.68rem;padding:.35rem .6rem;border:1px solid var(--rule);
  background:none;cursor:pointer;border-radius:2px;transition:.2s}
.mdbar button:hover{border-color:var(--claret);color:var(--claret)}
#bodyInput{min-height:26rem;font-size:1.02rem}

.drop{border:1px dashed var(--rule);padding:1.5rem;text-align:center;cursor:pointer;
  border-radius:3px;transition:.25s;font-size:.9rem;color:var(--dim)}
.drop:hover,.drop.over{border-color:var(--claret);color:var(--fg)}
.drop img{margin:0 auto 1rem;max-height:11rem;width:auto}

.plist{border-top:1px solid var(--rule)}
.prow{display:grid;grid-template-columns:3.2rem minmax(0,1fr) auto;gap:1rem;align-items:center;
  padding:.9rem 0;border-bottom:1px solid var(--rule)}
.prow img{width:3.2rem;height:4rem;object-fit:cover;background:var(--rule)}
.prow h4{font-family:var(--display);font-size:1.15rem;margin:0 0 .2rem;font-weight:400}
.prow .meta{font-family:var(--util);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.pill{display:inline-block;font-family:var(--util);font-size:.6rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;padding:.2rem .5rem;border-radius:99px;margin-right:.5rem}
.pill.live{background:rgba(142,31,43,.14);color:var(--claret)}
.pill.draft{background:rgba(154,139,121,.18);color:var(--dim)}
.pill.home{background:rgba(176,140,63,.18);color:#8A6C24}

.toast{position:fixed;left:50%;bottom:2rem;transform:translate(-50%,150%);z-index:1000;
  background:var(--ink);color:var(--paper);padding:.85rem 1.4rem;border-radius:3px;
  font-family:var(--util);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--ink-3);transition:transform .5s var(--ease)}
.toast.show{transform:translate(-50%,0)}

.setup{border:1px solid var(--rule);padding:1.5rem;border-radius:3px;background:var(--surface);
  font-size:.95rem;margin-bottom:2rem}
.setup code{font-family:ui-monospace,monospace;font-size:.85em;background:rgba(0,0,0,.06);padding:.1em .35em}
.setup ol{padding-left:1.2rem;margin:.8rem 0 0}
.setup li{margin-bottom:.5rem}

.empty{text-align:center;padding:5rem 1rem;color:var(--dim);font-style:italic}

/* ════════════════════════════ RESPONSIVE ════════════════════════════ */
@media (max-width:900px){
  .hero-in{grid-template-columns:1fr;min-height:auto;padding-top:2.5rem}

const store = {

async function loadPosts(){
  if (!db) { store.posts = SAMPLES.slice(); store.loaded=true; return; }
  const { collection, getDocs, query, orderBy, doc, getDoc } = fb;
  const snap = await getDocs(query(collection(db,"posts"), orderBy("publishedAt","desc")));
  store.posts = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  try {
    const s = await getDoc(doc(db,"settings","site"));
    if (s.exists()) store.site = { ...store.site, ...s.data() };
  } catch(e){}
  store.loaded = true;
}

async function fullImage(post){
  if (post.image) return post.image;
  if (!db) return post.thumb;
  const { doc, getDoc } = fb;
  try {
    const d = await getDoc(doc(db,"posts",post.id,"media","cover"));
    if (d.exists()) return d.data().data;
  } catch(e){}
  return post.thumb;
}

const published = () => store.posts
  .filter(p=>p.status==="published")
  .sort((a,b)=> (b.featured?1:0)-(a.featured?1:0) || String(b.publishedAt).localeCompare(String(a.publishedAt)));

/* — compact Markdown renderer (no dependency, fully escaped) — */
function md(src){
  const inline = s => esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
  const lines = String(src||"").replace(/\r/g,"").split("\n");
  let out=[], para=[], list=null;
  const flushP=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const flushL=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for (const raw of lines){
    const l = raw.trimEnd();
    if (!l.trim()){ flushP(); flushL(); continue; }
    let m;
    if (/^(---|\*\*\*)\s*$/.test(l)){ flushP(); flushL(); out.push("<hr>"); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))){ flushP(); flushL();
      const lv = Math.min(m[1].length+1,4); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if ((m = l.match(/^>\s?(.*)$/))){ flushP(); flushL();
      out.push(`<blockquote><p>${inline(m[1])}</p></blockquote>`); continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){ flushP();
      if(list!=="ul"){ flushL(); out.push("<ul>"); list="ul"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP();
      if(list!=="ol"){ flushL(); out.push("<ol>"); list="ol"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL();
  return out.join("\n");
}

/* — image intake: resize + compress on the client — */
function processImage(file, maxW, quality){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onerror = ()=>rej(new Error("Couldn't read that file."));
    r.onload = () => {
      const img = new Image();
      img.onerror = ()=>rej(new Error("That file isn't an image we can open."));
      img.onload = () => {
        const scale = Math.min(1, maxW/img.width);
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let q = quality, out = c.toDataURL("image/jpeg", q);
        while (out.length > 780000 && q > 0.35){ q -= 0.08; out = c.toDataURL("image/jpeg", q); }
        res(out);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

/* — scroll reveal — */
let io;
function observeRises(){
  io?.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),
    {rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rise").forEach(el=>io.observe(el));
}

function viewArchive(){
  const all = published();
  const tags = [...new Set(all.flatMap(p=>p.tags||[]))].sort();
  return `
  <section class="section">
    <div class="section-head" style="margin-bottom:1.5rem">

function renderArchiveGrid(){
  const g = $("#archiveGrid"); if(!g) return;
  const q = archiveFilter.q.toLowerCase().trim();
  const items = published().filter(p=>{
    if (archiveFilter.tag && !(p.tags||[]).includes(archiveFilter.tag)) return false;
    if (!q) return true;
    return (p.title+" "+(p.dek||"")+" "+(p.body||"")+" "+(p.tags||[]).join(" ")+" "+p.publishedAt)
      .toLowerCase().includes(q);
  });
  g.innerHTML = items.length ? items.map(p=>`
    <a class="card rise" href="#/essay/${esc(p.slug)}">
      <div class="card-img"><img src="${esc(p.thumb||p.image||"")}" alt="" loading="lazy"></div>

      <h3 class="card-title">${esc(p.title)}</h3>

    </a>`).join("")
    : `<p class="empty" style="grid-column:1/-1">Nothing matches that. Try a shorter word.</p>`;
  observeRises();
}

async function viewEssay(slug){
  const p = published().find(x=>x.slug===slug) ||
            (store.user && store.posts.find(x=>x.slug===slug));
  if (!p) return `<div class="empty">That essay isn't here. Try the <a href="#/archive">archive</a>.</div>`;
  const img = await fullImage(p);
  const all = published();
  const i = all.findIndex(x=>x.id===p.id);
  const nxt = all[i+1];
  return `
  ${img?`<div class="essay-hero"><img src="${esc(img)}" alt=""></div>`:""}
  <header class="essay-head">
    <p class="eyebrow">${esc(fmtDate(p.publishedAt))} &nbsp;·&nbsp; ${readMins(p.body)} min read${p.status!=="published"?" · Draft":""}</p>
    <h1 class="essay-title">${esc(p.title)}</h1>
    ${p.dek?`<p class="essay-dek">${esc(p.dek)}</p>`:""}
  </header>
  <article class="essay-body">${md(p.body)}</article>
  <div class="essay-foot">
    <hr class="rule" style="margin-bottom:2rem">
    ${nxt?`<p class="eyebrow" style="margin:0 0 .6rem">Next</p>
      <a class="entry" href="#/essay/${esc(nxt.slug)}" style="border:0;padding:0;grid-template-columns:minmax(0,1fr) 5.5rem">

        <img class="entry-thumb" style="opacity:.9;transform:none" src="${esc(nxt.thumb||"")}" alt="">
      </a>`:`<p class="eyebrow">You've reached the beginning. <a href="#/archive">Back to the archive</a></p>`}
  </div>`;
}

      <p class="meta">
        <span class="pill ${p.status==="published"?"live":"draft"}">${p.status==="published"?"Published":"Draft"}</span>
        ${p.featured?`<span class="pill home">Kept on home</span>`:""}
        ${esc(fmtDate(p.publishedAt))}
      </p>
    </div>
    <div class="btnrow">
      <a class="btn ghost" href="#/essay/${esc(p.slug)}">View</a>
      <button class="btn" data-edit="${esc(p.id)}">Edit</button>
      <button class="btn danger" data-del="${esc(p.id)}">Delete</button>
    </div>
  </div>`;
}

      <div class="btnrow">

          <p class="hint">Markdown: <code>## Heading</code>, <code>**bold**</code>, <code>*italic*</code>, <code>&gt; quote</code>, <code>- list</code>, <code>[text](url)</code></p>

/* ══════════════════════════════════════════════════════════════════
   6. STUDIO ACTIONS
   ══════════════════════════════════════════════════════════════════ */
function collectDraft(){
  const g = id => document.getElementById(id);
  draft.title = g("titleInput").value.trim();
  draft.dek   = g("dekInput").value.trim();
  draft.body  = g("bodyInput").value;
  draft.publishedAt = g("dateInput").value || new Date().toISOString().slice(0,10);
  draft.tags  = g("tagsInput").value.split(",").map(s=>s.trim()).filter(Boolean);
  draft.slug  = slugify(g("slugInput").value || draft.title);
  draft.featured = g("featuredInput").checked;
  return draft;
}

async function savePost(status){
  collectDraft();
  if (!draft.title){ toast("Give it a title first"); return; }
  if (!draft.slug) draft.slug = "essay-"+Date.now();
  if (store.posts.some(p=>p.slug===draft.slug && p.id!==draft.id)) draft.slug += "-2";
  draft.status = status;

  const { collection, doc, setDoc, addDoc, serverTimestamp } = fb;
  const payload = {
    title:draft.title, slug:draft.slug, dek:draft.dek, body:draft.body,
    tags:draft.tags, thumb:draft.thumb||"", status, featured:!!draft.featured,
    publishedAt:draft.publishedAt, updatedAt:new Date().toISOString()
  };
  try{
    let id = draft.id;
    if (id) await setDoc(doc(db,"posts",id), payload, {merge:true});
    else { const ref = await addDoc(collection(db,"posts"), payload); id = ref.id; draft.id = id; }
    if (draft._newFull){
      await setDoc(doc(db,"posts",id,"media","cover"), { data: draft._newFull });
      draft._newFull = null;
    }
    await loadPosts();
    toast(status==="published" ? "Published" : "Draft saved");
    draft = null; render();
  }catch(e){
    console.error(e);
    toast("Couldn't save — check your Firestore rules");
  }
}

async function deletePost(id){
  const p = store.posts.find(x=>x.id===id);
  if (!confirm(`Delete "${p?.title||"this essay"}"? This can't be undone.`)) return;
  const { doc, deleteDoc } = fb;
  try{
    await deleteDoc(doc(db,"posts",id,"media","cover")).catch(()=>{});
    await deleteDoc(doc(db,"posts",id));
    await loadPosts(); toast("Deleted"); render();
  }catch(e){ toast("Couldn't delete that"); }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify({site:store.site,posts:store.posts},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `badmad-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup downloaded");
}

async function saveSettings(){
  const t = prompt("Site title", store.site.title); if (t===null) return;
  const b = prompt("The line about you (shown on the home page)", store.site.bio); if (b===null) return;
  const y = prompt("Signature", store.site.byline); if (y===null) return;
  const e = prompt("Contact email", store.site.email); if (e===null) return;
  const { doc, setDoc } = fb;
  store.site = { title:t, bio:b, byline:y, email:e };
  try{ await setDoc(doc(db,"settings","site"), store.site, {merge:true}); toast("Site details saved"); render(); }
  catch(err){ toast("Couldn't save site details"); }
}

function wrapSel(kind){
  const ta = document.getElementById("bodyInput");
  const [s,e] = [ta.selectionStart, ta.selectionEnd];
  const sel = ta.value.slice(s,e);
  const map = {
    h2:["\n## ","\n"], b:["**","**"], i:["*","*"], q:["\n> ","\n"],
    ul:["\n- ","\n"], link:["[","](https://)"], hr:["\n\n---\n\n",""]
  };
  const [a,z] = map[kind];
  ta.value = ta.value.slice(0,s) + a + sel + z + ta.value.slice(e);
  ta.focus();
  ta.selectionStart = s+a.length; ta.selectionEnd = s+a.length+sel.length;
}

/* ══════════════════════════════════════════════════════════════════
   7. ROUTER + EVENTS
   ══════════════════════════════════════════════════════════════════ */
function route(){
  const h = location.hash.replace(/^#/,"") || "/";
  const parts = h.split("/").filter(Boolean);
  return { name: parts[0]||"home", arg: parts[1]||"" };
}

async function render(){
  const r = route();
  const app = $("#app");
  const paper = (r.name==="essay" || r.name==="studio");
  document.body.dataset.mode = paper ? "paper" : "ink";

  app.innerHTML = `<div class="empty">…</div>`;
  if (!store.loaded) await loadPosts();

  if (r.name==="archive")      app.innerHTML = viewArchive();
  else if (r.name==="essay")   app.innerHTML = await viewEssay(r.arg);
  else if (r.name==="contact") app.innerHTML = viewContact();
  else if (r.name==="studio")  app.innerHTML = viewStudio();
  else                         app.innerHTML = viewHome();

  $("#footLeft").textContent = store.site.title;
  document.title = r.name==="essay"
    ? `${(store.posts.find(p=>p.slug===r.arg)||{}).title||"Essay"} — ${store.site.title}`
    : store.site.title;

  document.querySelectorAll("#nav a").forEach(a=>{
    const t = a.getAttribute("href").replace("#/","")||"home";
    if (t===r.name) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });

  if (r.name==="archive") renderArchiveGrid();
  if (r.name==="studio" && draft) bindEditor();
  observeRises();
  window.scrollTo({top:0,behavior:"instant"});
}

function bindEditor(){
  const ta = document.getElementById("bodyInput");
  document.querySelectorAll(".mdbar [data-md]").forEach(b=>
    b.onclick = ()=> wrapSel(b.dataset.md));
  document.getElementById("previewToggle").onclick = e=>{
    const pane = document.getElementById("previewPane");
    const on = pane.style.display==="none";
    pane.style.display = on?"block":"none";
    ta.style.display = on?"none":"block";
    e.target.textContent = on?"Write":"Preview";
    if (on) pane.innerHTML = md(ta.value);
  };
  const ti = document.getElementById("titleInput"), si = document.getElementById("slugInput");
  ti.oninput = ()=>{ if(!draft.id && !si.dataset.touched) si.value = slugify(ti.value); };
  si.oninput = ()=> si.dataset.touched = "1";

  const drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = ()=>file.click();
  drop.ondragover = e=>{e.preventDefault();drop.classList.add("over")};
  drop.ondragleave = ()=>drop.classList.remove("over");
  drop.ondrop = e=>{e.preventDefault();drop.classList.remove("over");takeImage(e.dataTransfer.files[0])};
  file.onchange = ()=>takeImage(file.files[0]);
  const rm = document.getElementById("removeImg");
  if (rm) rm.onclick = ()=>{ collectDraft(); draft.thumb=""; draft._newFull=null; render(); };
}

async function takeImage(f){
  if (!f) return;
  if (!f.type.startsWith("image/")){ toast("That's not an image"); return; }
  toast("Processing image…");
  try{
    collectDraft();
    draft.thumb    = await processImage(f, 720, 0.72);   // list + cards
    draft._newFull = await processImage(f, 1800, 0.86);  // essay hero
    render();
  }catch(e){ toast(e.message); }
}

document.addEventListener("click", async e=>{
  const t = e.target.closest("button, .tag");
  if (!t) return;

  if (t.id==="loginBtn"){
    const em=$("#em").value.trim(), pw=$("#pw").value;
    try{ await fb.signInWithEmailAndPassword(auth, em, pw); }
    catch(err){ $("#loginErr").textContent = "That email and password don't match."; }
  }
  if (t.id==="signout"){ await fb.signOut(auth); }
  if (t.id==="newBtn"){ draft = blankPost(); render(); }
  if (t.dataset.edit){ draft = { ...store.posts.find(p=>p.id===t.dataset.edit) }; render(); }
  if (t.dataset.del) deletePost(t.dataset.del);
  if (t.id==="backBtn"){ draft=null; render(); }
  if (t.id==="saveDraft") savePost("draft");
  if (t.id==="publishBtn") savePost("published");
  if (t.id==="unpublishBtn") savePost("draft");
  if (t.id==="exportBtn") exportJSON();
  if (t.id==="settingsBtn") saveSettings();

  if (t.classList.contains("tag")){
    archiveFilter.tag = t.dataset.tag;
    document.querySelectorAll(".tag").forEach(x=>x.setAttribute("aria-pressed", x.dataset.tag===archiveFilter.tag));
    renderArchiveGrid();
  }
});

document.addEventListener("input", e=>{
  if (e.target.id==="q"){ archiveFilter.q = e.target.value; renderArchiveGrid(); }
});

document.addEventListener("keydown", e=>{
  if ((e.metaKey||e.ctrlKey) && e.key==="s" && draft){ e.preventDefault(); savePost(draft.status||"draft"); }
});

window.addEventListener("hashchange", ()=>{ if(route().name!=="studio") draft=null; render(); });

if (auth) fb.onAuthStateChanged(auth, async u=>{
  store.user = (u && u.email===CFG.editorEmail) ? u : null;
  if (u && u.email!==CFG.editorEmail){ await fb.signOut(auth); toast("That account can't edit this site"); }
  if (route().name==="studio") render();
});

await loadPosts();
render();
</script>

    tint:   "gold"    // "gold" recolours black line art to the site's gilt.
                      // "none" shows the file exactly as drawn.
  }
};

<style>
/* ════════════════════════════ TOKENS ════════════════════════════ */
:root{
  --ink:#0D0A09; --ink-2:#15100E; --ink-3:#241C17;
  --paper:#F0E7D7; --paper-2:#E4D8C2;
  --muted:#9C8B76;
  --claret:#7E1620; --claret-lt:#B23A44;
  --g1:#5E4318; --g2:#E8CE8C; --g3:#A2802F; --g4:#F5E3B4;
  --gold:linear-gradient(135deg,var(--g1) 0%,var(--g2) 22%,var(--g3) 45%,var(--g4) 68%,var(--g1) 100%);

  --bg:var(--ink); --fg:var(--paper); --dim:var(--muted);
  --rule:var(--ink-3); --surface:var(--ink-2); --frame:rgba(232,206,140,.34);

  --display:"Bodoni Moda",Didot,Georgia,serif;
  --fell:"IM Fell English",Georgia,serif;
  --fellsc:"IM Fell English SC",Georgia,serif;
  --read:"Newsreader",Georgia,serif;
  --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;

  --gut:clamp(1.5rem,5vw,5.5rem);
  --inset:clamp(.5rem,1.4vw,1.15rem);
  --measure:37rem;
  --ease:cubic-bezier(.22,.61,.36,1);
}
body[data-mode="paper"]{
  --bg:var(--paper); --fg:#181210; --dim:#6E5F4C;
  --rule:#CBBA9C; --surface:var(--paper-2); --frame:rgba(94,67,24,.32);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--read);font-weight:300;font-size:1.0625rem;line-height:1.72;
  transition:background-color .8s var(--ease),color .8s var(--ease);
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--claret-lt);outline-offset:3px}

body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:960;opacity:.4;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.3'/></svg>");
}

/* ═════════════════ SIGNATURE 1 · THE GILT BINDING ═════════════════ */
.binding{position:fixed;inset:var(--inset);z-index:950;pointer-events:none}
.binding .r1,.binding .r2{position:absolute;inset:0;border:1px solid var(--frame);transition:border-color .8s var(--ease)}
.binding .r2{inset:5px;border-color:color-mix(in srgb,var(--frame) 50%,transparent)}
.binding .corner{position:absolute;width:40px;height:40px}
.binding .corner path{fill:none;stroke:var(--frame);stroke-width:1.1}
.binding .tl{top:-1px;left:-1px}
.binding .tr{top:-1px;right:-1px;transform:scaleX(-1)}
.binding .bl{bottom:-1px;left:-1px;transform:scaleY(-1)}
.binding .br{bottom:-1px;right:-1px;transform:scale(-1)}
@media (max-width:640px){.binding .corner{width:26px;height:26px}}

/* ════════════════════════════ CHROME ════════════════════════════ */
.masthead{
  position:sticky;top:0;z-index:900;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.05rem calc(var(--gut) + var(--inset)) 1rem;
  background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 95%,transparent) 55%,transparent);
  backdrop-filter:blur(10px) saturate(1.15);
  transition:background .6s var(--ease);
}
/* over a cinematic plate the bar stays clear until you scroll */
body[data-cinema]:not(.scrolled) .masthead{
  background:linear-gradient(to bottom,rgba(13,10,9,.62),rgba(13,10,9,.1) 70%,transparent);
  backdrop-filter:none;
}
body[data-cinema]:not(.scrolled) .nav a{color:#C6B69C}
body[data-cinema]:not(.scrolled) .nav a:hover,
body[data-cinema]:not(.scrolled) .nav a[aria-current="page"]{color:#F5EDDD}
.wordmark{
  font-family:var(--fellsc);font-size:clamp(.95rem,1.9vw,1.3rem);
  letter-spacing:.13em;text-decoration:none;white-space:nowrap;line-height:1;
  background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.wordmark.has-logo{display:inline-flex;align-items:center;background:none;color:inherit}
.logo-mark{display:inline-block;background:var(--gold);
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo-mark img,.logo-img{height:var(--logo-h,54px);width:auto;display:block}
.logo-mark img{opacity:0}
.flip .logo-mark,.flip .logo-img{transform:scaleX(-1)}
.logo-big{display:flex;justify-content:center;margin:0 auto 1.75rem}
.logo-big .logo-mark img,.logo-big .logo-img{height:clamp(64px,9vw,112px)}
.nav{display:flex;gap:clamp(.85rem,2.2vw,2rem);align-items:center}
.nav a{
  font-family:var(--fellsc);font-size:.85rem;letter-spacing:.15em;
  text-decoration:none;color:var(--dim);position:relative;padding-bottom:3px;transition:color .35s;
}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:1px;
  background:var(--claret-lt);transition:right .45s var(--ease)}
.nav a:hover{color:var(--fg)}
.nav a:hover::after,.nav a[aria-current="page"]::after{right:0}
.nav a[aria-current="page"]{color:var(--fg)}

/* ═══════════════ SIGNATURE 2 · THE DUOTONE PLATE ═══════════════ */
.duo{position:relative;overflow:hidden;isolation:isolate;background:var(--ink)}
.duo>img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.22) brightness(.62);
  transform:scale(1.09);
  animation:drift 46s ease-in-out infinite alternate;
}
@keyframes drift{
  from{transform:scale(1.09) translate3d(-1.2%,-.8%,0)}
  to  {transform:scale(1.19) translate3d(1.5%,1.2%,0)}
}
.duo::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:linear-gradient(158deg,#7E1620 0%,#3A1A1E 34%,#8A6A2C 62%,#C9A55E 100%);
  mix-blend-mode:overlay;opacity:.72;
}
.duo::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:
    radial-gradient(105% 78% at 62% 34%,transparent 12%,rgba(13,10,9,.5) 62%,var(--ink) 100%),
    linear-gradient(to top,var(--ink) 2%,transparent 46%);
}
/* Line art is not a photograph. Drawings sit on a paper ground with the
   white of the page multiplied away, framed like an engraved plate — no
   desaturation, no vignette eating the strokes. */
.duo.drawing{background:#EFE5D1;border:1px solid var(--frame);outline:1px solid rgba(232,206,140,.14);outline-offset:5px}
.duo.drawing>img{filter:contrast(1.06) sepia(.22);mix-blend-mode:multiply;
  object-fit:contain;padding:7%;transform:none;animation:none}
.duo.drawing::before{mix-blend-mode:multiply;opacity:1;
  background:linear-gradient(158deg,rgba(126,22,32,.09) 0%,rgba(58,26,30,.05) 40%,rgba(162,128,47,.14) 100%)}
.duo.drawing::after{background:
  radial-gradient(120% 100% at 50% 42%,transparent 52%,rgba(94,67,24,.16) 100%),
  linear-gradient(to bottom,rgba(94,67,24,.07),transparent 22%)}
.card:hover>.duo.drawing>img{transform:scale(1.05)}
.card>.duo.drawing>img{transition:transform 1.2s var(--ease)}

/* the marbled ink field, used as a ground behind drawn plates */
.inkfield{position:absolute;inset:0;overflow:hidden;z-index:0}
.inkfield .veil{mix-blend-mode:normal;opacity:.42;inset:-14%}
.inkfield::after{content:"";position:absolute;inset:0;
  background:radial-gradient(115% 85% at 60% 40%,transparent 0%,rgba(13,10,9,.72) 58%,var(--ink) 100%)}

.veil{position:absolute;inset:-12%;pointer-events:none;mix-blend-mode:soft-light;opacity:.6;z-index:1}
.veil svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:reduce){
  .duo>img{animation:none;transform:scale(1.05)}
  .veil animate{display:none}
}

/* ════════════════════════════ HERO ════════════════════════════ */
.hero{position:relative;min-height:clamp(30rem,92vh,58rem);display:flex;align-items:flex-end;isolation:isolate}
.hero>.duo{position:absolute;inset:0;z-index:0}
.hero-in{
  position:relative;z-index:4;width:100%;max-width:92rem;margin-inline:auto;
  padding:0 calc(var(--gut) + var(--inset)) clamp(3rem,9vh,6.5rem);
}
.hero.drawn{align-items:center}
.hero-in.split{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
  gap:clamp(2rem,5.5vw,5rem);align-items:center;
  padding-top:clamp(3rem,10vh,6rem);padding-bottom:clamp(3rem,10vh,6rem)}
.hero-plate{margin:0;transform:rotate(-1deg)}
.hero-plate .duo{aspect-ratio:4/5}
.essay-top.drawn{align-items:center}
.essay-top.drawn .essay-top-in{padding-top:clamp(4rem,10vh,7rem)}
.essay-plate{margin:0 auto clamp(1.5rem,4vh,2.5rem);max-width:24rem}
.essay-plate .duo{aspect-ratio:4/5}
@media (max-width:900px){
  .hero-in.split{grid-template-columns:1fr}
  .hero-plate{order:-1;max-width:20rem;margin-inline:auto}
  .essay-plate{max-width:17rem}
}
.no{font-family:var(--fellsc);font-size:.88rem;letter-spacing:.2em;
  background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.1rem}
.kicker .sep{width:2.4rem;height:1px;background:rgba(232,206,140,.4)}
.kicker .when{font-family:var(--fellsc);font-size:.82rem;letter-spacing:.17em;color:#D9C7A8}
.hero-title{
  font-family:var(--display);font-weight:400;
  font-size:clamp(3rem,10.5vw,9.5rem);line-height:.85;letter-spacing:-.028em;
  margin:0 0 .2em;max-width:15ch;text-wrap:balance;
  text-shadow:0 .06em .5em rgba(13,10,9,.55);
}
.hero-title.long{font-size:clamp(2.4rem,5.6vw,5.2rem);line-height:.92;max-width:19ch}
.essay-title.long{font-size:clamp(2rem,4.6vw,4rem);line-height:1}
.hero-title a{text-decoration:none;
  background-image:linear-gradient(var(--g2),var(--g2));
  background-size:0% 1px;background-repeat:no-repeat;background-position:0 96%;
  transition:background-size .7s var(--ease)}
.hero-title a:hover{background-size:100% 1px}
.hero-dek{
  font-family:var(--fell);font-style:italic;
  font-size:clamp(1.1rem,1.85vw,1.6rem);line-height:1.45;color:#E6D9C0;
  max-width:34rem;margin:0 0 2rem;text-shadow:0 1px 12px rgba(13,10,9,.7);
}
.enter{
  display:inline-flex;align-items:center;text-decoration:none;
  font-family:var(--fellsc);font-size:.9rem;letter-spacing:.2em;
  padding:.9rem 1.7rem;border:1px solid var(--frame);position:relative;overflow:hidden;
  background:rgba(13,10,9,.3);backdrop-filter:blur(3px);
}
.enter span{position:relative;z-index:2;transition:color .45s}
.enter::before{content:"";position:absolute;inset:0;background:var(--gold);
  transform:translateY(101%);transition:transform .5s var(--ease)}
.enter:hover::before{transform:none}
.enter:hover span{color:#17110A}

/* ═══════════════════════ ORNAMENT ═══════════════════════ */
.fleuron{display:block;margin:0 auto;width:min(15rem,62%);height:auto}
.fleuron path,.fleuron circle{fill:var(--frame)}
.fleuron .bar path{fill:none;stroke:var(--frame);stroke-width:1}

/* ═════════════════════ COLOPHON ═════════════════════ */
.colophon{position:relative;text-align:center;
  padding:clamp(3.5rem,9vh,6.5rem) calc(var(--gut) + var(--inset));
  max-width:58rem;margin-inline:auto}
.colophon .said{font-family:var(--display);font-weight:400;font-style:italic;
  font-size:clamp(1.4rem,3.3vw,2.6rem);line-height:1.24;margin:2rem 0 1.4rem;text-wrap:balance}
.colophon .sig{font-family:var(--fellsc);font-size:.88rem;letter-spacing:.2em;color:var(--dim)}

/* ═════════════════ SIGNATURE 3 · THE CONTENTS ═════════════════ */
.section{padding:clamp(2.5rem,7vh,5rem) calc(var(--gut) + var(--inset));max-width:92rem;margin-inline:auto}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  border-bottom:1px solid var(--rule);padding-bottom:.9rem;margin-bottom:.5rem}
.label{font-family:var(--fellsc);font-size:.88rem;letter-spacing:.2em;color:var(--dim)}
.section-head a{font-family:var(--fellsc);font-size:.85rem;letter-spacing:.17em;
  text-decoration:none;color:var(--dim);transition:color .35s}
.section-head a:hover{color:var(--g2)}

.entry{
  display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;
  gap:clamp(1rem,3vw,2.5rem);align-items:baseline;
  padding:clamp(1.5rem,3.4vw,2.6rem) 0;border-bottom:1px solid var(--rule);
  text-decoration:none;position:relative;transition:padding-left .55s var(--ease);
}
.entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--gold);transform:scaleY(0);transform-origin:top;
  transition:transform .55s var(--ease)}
@media (hover:hover){
  .entry:hover{padding-left:1.4rem}
  .entry:hover::before{transform:scaleY(1)}
}
.entry-no{font-family:var(--fellsc);font-size:.82rem;letter-spacing:.14em;color:var(--dim)}
.entry-title{font-family:var(--display);font-weight:400;
  font-size:clamp(1.65rem,4.2vw,3.1rem);line-height:1.02;letter-spacing:-.02em;
  margin:0 0 .35rem;transition:color .4s}
.entry:hover .entry-title{color:var(--g2)}
.entry-dek{font-family:var(--fell);font-style:italic;color:var(--dim);font-size:1.02rem;margin:0;max-width:36rem}
.entry-meta{font-family:var(--fellsc);font-size:.8rem;letter-spacing:.14em;color:var(--dim);white-space:nowrap}
@media (max-width:700px){
  .entry{grid-template-columns:minmax(0,1fr)}
  .entry-meta{grid-row:1}
  .entry-no{display:none}
}

#hoverplate{position:fixed;top:0;left:0;z-index:940;width:15rem;pointer-events:none;
  opacity:0;transition:opacity .45s var(--ease);will-change:transform}
#hoverplate .duo{aspect-ratio:3/4;border:1px solid var(--frame)}
#hoverplate .duo::after{background:radial-gradient(100% 100% at 50% 40%,transparent 30%,rgba(13,10,9,.5) 100%)}
#hoverplate.on{opacity:1}
@media (hover:none),(max-width:900px){#hoverplate{display:none}}

/* ═════════════════════ ARCHIVE MOSAIC ═════════════════════ */
.finder{display:flex;align-items:center;gap:1.2rem;border:1px solid var(--rule);
  padding:.9rem 1.3rem;margin-bottom:1.6rem;background:var(--surface)}
.finder input{flex:1;background:none;border:0;color:var(--fg);
  font-family:var(--display);font-size:clamp(1.1rem,2.4vw,1.6rem);padding:.2rem 0;min-width:0}
.finder input::placeholder{color:var(--dim);font-style:italic}
.finder input:focus{outline:none}
.finder .count{font-family:var(--fellsc);font-size:.8rem;letter-spacing:.15em;color:var(--dim);white-space:nowrap}

.tagrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.4rem}
.tag{font-family:var(--fellsc);font-size:.8rem;letter-spacing:.13em;
  padding:.4rem .9rem;border:1px solid var(--rule);color:var(--dim);
  cursor:pointer;background:none;transition:.3s}
.tag:hover{border-color:var(--frame);color:var(--fg)}
.tag[aria-pressed="true"]{background:var(--claret);border-color:var(--claret);color:#F3E7CE}

.mosaic{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(1rem,2.2vw,2rem)}
.card{text-decoration:none;grid-column:span 2;display:block;position:relative}
.card.wide{grid-column:span 3}
.card.big{grid-column:span 4}
.card>.duo{aspect-ratio:3/4;margin-bottom:1rem}
.card.wide>.duo,.card.big>.duo{aspect-ratio:16/10}
.card>.duo>img{transition:transform 1.4s var(--ease)}
.card:hover>.duo>img{transform:scale(1.13)}
.card>.duo::before{transition:opacity .6s}
.card:hover>.duo::before{opacity:.34}
.card-title{font-family:var(--display);font-weight:400;font-size:clamp(1.15rem,2.1vw,1.7rem);
  line-height:1.1;margin:.45rem 0 .35rem;transition:color .35s}
.card.big .card-title,.card.wide .card-title{font-size:clamp(1.4rem,2.8vw,2.3rem)}
.card:hover .card-title{color:var(--g2)}
.card-dek{font-family:var(--fell);font-style:italic;color:var(--dim);font-size:.95rem;margin:0}
.card .no{font-size:.78rem}
@media (max-width:900px){
  .mosaic{grid-template-columns:repeat(2,1fr)}
  .card,.card.wide{grid-column:span 1}
  .card.big{grid-column:span 2}
  .card.wide>.duo{aspect-ratio:3/4}
}
.more{display:block;margin:3.5rem auto 0;font-family:var(--fellsc);font-size:.88rem;letter-spacing:.2em;
  padding:.9rem 2.4rem;border:1px solid var(--rule);background:none;cursor:pointer;transition:.35s;color:var(--dim)}
.more:hover{border-color:var(--frame);color:var(--g2)}

/* ════════════════════════════ ESSAY ════════════════════════════ */
.essay-top{position:relative;min-height:clamp(24rem,72vh,44rem);display:flex;align-items:flex-end;isolation:isolate}
.essay-top>.duo{position:absolute;inset:0;z-index:0}
.essay-top-in{position:relative;z-index:4;width:100%;max-width:64rem;margin-inline:auto;
  padding:0 calc(var(--gut) + var(--inset)) clamp(2.5rem,7vh,5rem);text-align:center}
.essay-title{font-family:var(--display);font-weight:400;
  font-size:clamp(2.3rem,7.5vw,6rem);line-height:.92;letter-spacing:-.025em;
  margin:.35em 0 .3em;text-wrap:balance;color:var(--paper);
  text-shadow:0 .05em .5em rgba(13,10,9,.6)}
.essay-dek{font-family:var(--fell);font-style:italic;font-size:clamp(1.05rem,1.9vw,1.45rem);
  color:#E6D9C0;margin:0 auto;max-width:32rem;text-shadow:0 1px 10px rgba(13,10,9,.7)}
.kicker.center{justify-content:center}

.essay-wrap{display:grid;grid-template-columns:11rem minmax(0,var(--measure)) 11rem;
  justify-content:center;gap:clamp(1.5rem,4vw,3.5rem);
  padding:clamp(3rem,8vh,5.5rem) calc(var(--gut) + var(--inset)) clamp(4rem,11vh,8rem)}
.margin-note{font-family:var(--fellsc);font-size:.8rem;letter-spacing:.13em;color:var(--dim);
  line-height:2.1;position:sticky;top:6rem;align-self:start;text-align:right}
.margin-note .mtag{display:block}
.essay-body{font-size:1.19rem;line-height:1.8;min-width:0}
.essay-body>p:first-of-type::first-letter{
  float:left;font-family:var(--display);font-size:4.9em;line-height:.76;
  padding:.05em .12em 0 0;font-weight:500;
  background:linear-gradient(150deg,#7E1620,#B23A44 40%,#8A6A2C 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.essay-body p{margin:0 0 1.4em}
.essay-body h2{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.12;margin:2.6em 0 .55em}
.essay-body h3{font-family:var(--fellsc);font-size:.92rem;letter-spacing:.2em;margin:2.6em 0 .8em;color:var(--dim)}

    body:`There is a particular ache that arrives when you look at a photograph taken decades before your birth. Someone is laughing in it. The light is wrong in a way that feels more right than any light you have ever stood in.

This is a placeholder essay — delete it from the Studio once your own writing is in.

> The word is *anemoia*, and it belongs to a dictionary of sorrows nobody asked for.

const store={ posts:[], user:null, loaded:false,
  site:{ title:"Bad, Mad & Dangerous to Know",
         bio:"I write about everything, and about books most of all.",
         byline:"Lord Byron",
         email:"lordbyron@badmaddangerous.com" } };

async function loadPosts(){
  if(!db){ store.posts=SAMPLES.slice(); store.loaded=true; return; }
  const { collection, getDocs, query, orderBy, doc, getDoc } = fb;
  const snap=await getDocs(query(collection(db,"posts"),orderBy("publishedAt","desc")));
  store.posts=snap.docs.map(d=>({ id:d.id, ...d.data() }));
  try{ const s=await getDoc(doc(db,"settings","site")); if(s.exists()) store.site={...store.site,...s.data()}; }catch(e){}
  store.loaded=true;
}
async function fullImage(post){
  if(post.image) return post.image;
  if(!db) return post.thumb;
  try{ const d=await fb.getDoc(fb.doc(db,"posts",post.id,"media","cover")); if(d.exists()) return d.data().data; }catch(e){}
  return post.thumb;
}

/* The swimming ink veil is an animated turbulence filter — gorgeous, but
   costly. Only the full-bleed plates get it; the archive tiles get the
   duotone alone, so 21 of them on screen stay smooth. */
const isDrawn = p => (p?.treat || "drawing") === "drawing";
const plate=(src,{veil=false,eager=false,drawing=false}={})=>
  `<div class="duo${drawing?" drawing":""}"><img src="${esc(src)}" alt="" ${eager?'fetchpriority="high"':'loading="lazy"'}>${drawing||!veil?"":VEIL}</div>`;

function md(src){
  const inline=s=>esc(s)
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
  const lines=String(src||"").replace(/\r/g,"").split("\n");
  let out=[],para=[],list=null;
  const fp=()=>{ if(para.length){ out.push("<p>"+inline(para.join(" "))+"</p>"); para=[]; } };
  const fl=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd(); let m;
    if(!l.trim()){ fp(); fl(); continue; }
    if(/^(---|\*\*\*)\s*$/.test(l)){ fp(); fl(); out.push("<hr>"); continue; }
    if((m=l.match(/^(#{1,4})\s+(.*)$/))){ fp(); fl();
      const lv=Math.min(m[1].length+1,4); out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if((m=l.match(/^>\s?(.*)$/))){ fp(); fl(); out.push(`<blockquote><p>${inline(m[1])}</p></blockquote>`); continue; }
    if((m=l.match(/^\s*[-*+]\s+(.*)$/))){ fp(); if(list!=="ul"){ fl(); out.push("<ul>"); list="ul"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ fp(); if(list!=="ol"){ fl(); out.push("<ol>"); list="ol"; }
      out.push(`<li>${inline(m[1])}</li>`); continue; }
    fl(); para.push(l.trim());
  }
  fp(); fl(); return out.join("\n");
}

function processImage(file,maxW,quality){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error("Couldn't read that file."));
    r.onload=()=>{ const img=new Image();
      img.onerror=()=>rej(new Error("That file isn't an image we can open."));
      img.onload=()=>{
        const s=Math.min(1,maxW/img.width),c=document.createElement("canvas");
        c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        let q=quality,out=c.toDataURL("image/jpeg",q);
        while(out.length>780000&&q>0.35){ q-=0.08; out=c.toDataURL("image/jpeg",q); }
        res(out); };
      img.src=r.result; };
    r.readAsDataURL(file);
  });
}

let io;
function observeRises(){
  io?.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }),
    {rootMargin:"0px 0px -6% 0px"});
  document.querySelectorAll(".rise").forEach(el=>io.observe(el));
}

function renderMosaic(){
  const g=$("#mosaic"); if(!g) return;
  const all=published(), q=archiveFilter.q.toLowerCase().trim();
  const items=all.filter(p=>{
    if(archiveFilter.tag && !(p.tags||[]).includes(archiveFilter.tag)) return false;
    if(!q) return true;
    return (p.title+" "+(p.dek||"")+" "+(p.body||"")+" "+(p.tags||[]).join(" ")+" "+p.publishedAt).toLowerCase().includes(q);
  });
  const slice=items.slice(0,archiveFilter.shown);
  g.innerHTML = slice.length ? slice.map((p,i)=>{
    const n=all.length-all.findIndex(x=>x.id===p.id);
    // 7-tile cycle fills three exact rows of the 6-column grid:
    // 4+2 · 2+2+2 · 3+3 — so the mosaic never leaves a hole.
    const m=i%7, cls = m===0 ? "big" : (m>=5 ? "wide" : "");
    return `<a class="card rise ${cls}" href="#/essay/${esc(p.slug)}">
      ${plate(p.thumb||p.image||"",{drawing:isDrawn(p)})}
      <span class="no">№ ${num(n)}</span>
      <h3 class="card-title">${esc(p.title)}</h3>
      ${p.dek?`<p class="card-dek">${esc(p.dek)}</p>`:""}
    </a>`;}).join("")
    : `<p class="empty" style="grid-column:1/-1">Nothing matches that. Try a shorter word.</p>`;
  $("#count").textContent=`${items.length} ${items.length===1?"ESSAY":"ESSAYS"}`;
  $("#moreWrap").innerHTML = items.length>archiveFilter.shown ? `<button class="more" id="moreBtn">Show more</button>` : "";
  observeRises();
}

    <aside class="margin-note">
      <span class="mtag">№ ${num(n)}</span>

      :`<p class="label" style="text-align:center;margin:2rem 0">You've reached the beginning. <a href="#/archive" style="color:var(--claret)">Back to the archive</a></p>`}
  </div>`;
}

function collectDraft(){
  const g=id=>document.getElementById(id);
  draft.title=g("titleInput").value.trim();
  draft.dek=g("dekInput").value.trim();
  draft.body=g("bodyInput").value;
  draft.publishedAt=g("dateInput").value||new Date().toISOString().slice(0,10);
  draft.tags=g("tagsInput").value.split(",").map(s=>s.trim()).filter(Boolean);
  draft.slug=slugify(g("slugInput").value||draft.title);
  draft.featured=g("featuredInput").checked;
  draft.treat=g("treatInput").value;
  return draft;
}
async function savePost(status){
  collectDraft();
  if(!draft.title){ toast("Give it a title first"); return; }
  if(!draft.slug) draft.slug="essay-"+Date.now();
  if(store.posts.some(p=>p.slug===draft.slug&&p.id!==draft.id)) draft.slug+="-2";
  draft.status=status;
  const { collection, doc, setDoc, addDoc }=fb;
  const payload={ title:draft.title,slug:draft.slug,dek:draft.dek,body:draft.body,tags:draft.tags,
    thumb:draft.thumb||"",treat:draft.treat||"drawing",status,featured:!!draft.featured,
    publishedAt:draft.publishedAt,updatedAt:new Date().toISOString() };
  try{
    let id=draft.id;
    if(id) await setDoc(doc(db,"posts",id),payload,{merge:true});
    else{ const ref=await addDoc(collection(db,"posts"),payload); id=ref.id; draft.id=id; }
    if(draft._newFull){ await setDoc(doc(db,"posts",id,"media","cover"),{data:draft._newFull}); draft._newFull=null; }
    await loadPosts(); toast(status==="published"?"Published":"Draft saved");
    draft=null; render();
  }catch(e){ console.error(e); toast("Couldn't save — check your Firestore rules"); }
}
async function deletePost(id){
  const p=store.posts.find(x=>x.id===id);
  if(!confirm(`Delete "${p?.title||"this essay"}"? This can't be undone.`)) return;
  try{
    await fb.deleteDoc(fb.doc(db,"posts",id,"media","cover")).catch(()=>{});
    await fb.deleteDoc(fb.doc(db,"posts",id));
    await loadPosts(); toast("Deleted"); render();
  }catch(e){ toast("Couldn't delete that"); }
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({site:store.site,posts:store.posts},null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`badmad-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href); toast("Backup downloaded");
}
async function importJSON(file){
  try{
    const data=JSON.parse(await file.text());
    const posts=Array.isArray(data)?data:data.posts;
    if(!Array.isArray(posts)) throw new Error("no posts array");
    if(!confirm(`Import ${posts.length} essays? Existing ones aren't touched.`)) return;
    for(const p of posts){
      const { id, image, ...rest }=p;
      const ref=await fb.addDoc(fb.collection(db,"posts"),
        { ...rest, slug: rest.slug||slugify(rest.title||"untitled") });
      if(image) await fb.setDoc(fb.doc(db,"posts",ref.id,"media","cover"),{data:image});
    }
    await loadPosts(); toast(`Imported ${posts.length}`); render();
  }catch(e){ console.error(e); toast("That file didn't look right"); }
}
async function saveSettings(){
  const t=prompt("Site title",store.site.title); if(t===null) return;
  const b=prompt("The line about you (shown on the home page)",store.site.bio); if(b===null) return;
  const y=prompt("Signature",store.site.byline); if(y===null) return;
  const e=prompt("Contact email",store.site.email); if(e===null) return;
  store.site={ title:t,bio:b,byline:y,email:e };
  try{ await fb.setDoc(fb.doc(db,"settings","site"),store.site,{merge:true}); toast("Site details saved"); render(); }
  catch(err){ toast("Couldn't save site details"); }
}
function wrapSel(kind){
  const ta=document.getElementById("bodyInput");
  const s=ta.selectionStart, e=ta.selectionEnd, sel=ta.value.slice(s,e);
  const map={ h2:["\n## ","\n"], b:["**","**"], i:["*","*"], q:["\n> ","\n"],
    ul:["\n- ","\n"], link:["[","](https://)"], hr:["\n\n---\n\n",""] };
  const [a,z]=map[kind];
  ta.value=ta.value.slice(0,s)+a+sel+z+ta.value.slice(e);
  ta.focus(); ta.selectionStart=s+a.length; ta.selectionEnd=s+a.length+sel.length;
}

/* ══════════════════════════════════════════════════════════════════
   7. CURSOR-BORNE PLATE
   ══════════════════════════════════════════════════════════════════ */
const hp=$("#hoverplate"), hpImg=hp.querySelector("img");
let hpT={x:0,y:0}, hpC={x:0,y:0}, hpRunning=false;
const canHover=matchMedia("(hover:hover)").matches && !matchMedia("(prefers-reduced-motion:reduce)").matches;
function hpLoop(){
  hpC.x+=(hpT.x-hpC.x)*.13; hpC.y+=(hpT.y-hpC.y)*.13;
  hp.style.transform=`translate3d(${hpC.x}px,${hpC.y}px,0)`;
  requestAnimationFrame(hpLoop);
}
if(canHover){
  document.addEventListener("mousemove",e=>{ hpT.x=e.clientX+28; hpT.y=e.clientY-150; },{passive:true});
  document.addEventListener("mouseover",e=>{
    const t=e.target.closest?.(".entry[data-plate]");
    if(t&&t.dataset.plate){
      hpImg.src=t.dataset.plate;
      hp.querySelector(".duo").classList.toggle("drawing", t.dataset.drawn==="1");
      hp.classList.add("on");
      if(!hpRunning){ hpRunning=true; hpC={...hpT}; hpLoop(); }
    }
  });
  document.addEventListener("mouseout",e=>{
    if(e.target.closest?.(".entry[data-plate]") && !e.relatedTarget?.closest?.(".entry[data-plate]"))
      hp.classList.remove("on");
  });
}

/* ══════════════════════════════════════════════════════════════════
   8. ROUTER + EVENTS
   ══════════════════════════════════════════════════════════════════ */
function route(){
  const parts=(location.hash.replace(/^#/,"")||"/").split("/").filter(Boolean);
  return { name:parts[0]||"home", arg:parts[1]||"" };
}
async function render(){
  const r=route(), app=$("#app");
  document.body.dataset.mode=(r.name==="essay"||r.name==="studio")?"paper":"ink";
  // home and essay open on a full-bleed plate; the masthead stays clear over it
  if(r.name==="home"||r.name==="essay") document.body.dataset.cinema="1";
  else delete document.body.dataset.cinema;
  document.body.classList.remove("scrolled");
  hp.classList.remove("on");
  if(!store.loaded) await loadPosts();

  if(r.name==="archive")      app.innerHTML=viewArchive();
  else if(r.name==="essay")   app.innerHTML=await viewEssay(r.arg);
  else if(r.name==="contact") app.innerHTML=viewContact();
  else if(r.name==="studio")  app.innerHTML=viewStudio();
  else                        app.innerHTML=viewHome();

  $("#footLeft").textContent=store.site.title;
  document.title = r.name==="essay"
    ? `${(store.posts.find(p=>p.slug===r.arg)||{}).title||"Essay"} — ${store.site.title}`
    : store.site.title;

  document.querySelectorAll("#nav a").forEach(a=>{
    const t=a.getAttribute("href").replace("#/","")||"home";
    if(t===r.name) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });

  if(r.name==="archive") renderMosaic();
  if(r.name==="studio"&&draft) bindEditor();
  observeRises();
  window.scrollTo({top:0,behavior:"instant"});
}
function bindEditor(){
  const ta=document.getElementById("bodyInput");
  document.querySelectorAll(".mdbar [data-md]").forEach(b=>b.onclick=()=>wrapSel(b.dataset.md));
  document.getElementById("previewToggle").onclick=e=>{
    const pane=document.getElementById("previewPane"), on=pane.style.display==="none";
    pane.style.display=on?"block":"none"; ta.style.display=on?"none":"block";
    e.target.textContent=on?"Write":"Preview"; if(on) pane.innerHTML=md(ta.value);
  };
  const ti=document.getElementById("titleInput"), si=document.getElementById("slugInput");
  ti.oninput=()=>{ if(!draft.id&&!si.dataset.touched) si.value=slugify(ti.value); };
  si.oninput=()=>si.dataset.touched="1";
  const drop=document.getElementById("drop"), file=document.getElementById("file");
  drop.onclick=()=>file.click();
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); takeImage(e.dataTransfer.files[0]); };
  file.onchange=()=>takeImage(file.files[0]);
  const rm=document.getElementById("removeImg");
  if(rm) rm.onclick=()=>{ collectDraft(); draft.thumb=""; draft._newFull=null; render(); };
}
async function takeImage(f){
  if(!f) return;
  if(!f.type.startsWith("image/")){ toast("That's not an image"); return; }
  toast("Processing image…");
  try{
    collectDraft();
    draft.thumb=await processImage(f,900,0.74);
    draft._newFull=await processImage(f,1900,0.86);
    render();
  }catch(e){ toast(e.message); }
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("button, .tag"); if(!t) return;
  if(t.id==="loginBtn"){
    try{ await fb.signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value); }
    catch(err){ $("#loginErr").textContent="That email and password don't match."; }
  }
  if(t.id==="signout") await fb.signOut(auth);
  if(t.id==="newBtn"){ draft=blankPost(); render(); }
  if(t.dataset.edit){ draft={...store.posts.find(p=>p.id===t.dataset.edit)}; render(); }
  if(t.dataset.del) deletePost(t.dataset.del);
  if(t.id==="backBtn"){ draft=null; render(); }
  if(t.id==="saveDraft") savePost("draft");
  if(t.id==="publishBtn") savePost("published");
  if(t.id==="unpublishBtn") savePost("draft");
  if(t.id==="exportBtn") exportJSON();
  if(t.id==="importBtn") document.getElementById("importFile").click();
  if(t.id==="settingsBtn") saveSettings();
  if(t.id==="moreBtn"){ archiveFilter.shown+=21; renderMosaic(); }
  if(t.classList.contains("tag")){
    archiveFilter.tag=t.dataset.tag; archiveFilter.shown=21;
    document.querySelectorAll(".tag").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tag===archiveFilter.tag));
    renderMosaic();
  }
});
document.addEventListener("change", e=>{
  if(e.target.id==="importFile"&&e.target.files[0]) importJSON(e.target.files[0]);
});
document.addEventListener("input", e=>{
  if(e.target.id==="q"){ archiveFilter.q=e.target.value; archiveFilter.shown=21; renderMosaic(); }
});
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="s"&&draft){ e.preventDefault(); savePost(draft.status||"draft"); }
});
window.addEventListener("scroll",()=>{
  document.body.classList.toggle("scrolled", window.scrollY>90);
},{passive:true});
window.addEventListener("hashchange",()=>{ if(route().name!=="studio") draft=null; render(); });

if(auth) fb.onAuthStateChanged(auth, async u=>{
  store.user=(u&&u.email===CFG.editorEmail)?u:null;
  if(u&&u.email!==CFG.editorEmail){ await fb.signOut(auth); toast("That account can't edit this site"); }
  if(route().name==="studio") render();
});

if(LOGO.src){
  const w=document.querySelector(".wordmark");
  w.classList.add("has-logo");
  if(LOGO.flip) w.classList.add("flip");
  w.innerHTML=logoHTML();
  w.setAttribute("aria-label", store.site.title);
}

await loadPosts();
if(LOGO.src) document.querySelector(".wordmark").setAttribute("aria-label", store.site.title);
render();
</script>
</body>
</html>

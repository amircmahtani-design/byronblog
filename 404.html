<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Bad, Mad &amp; Dangerous</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<style>
  :root{ --bg:#0D0D0D; --ink:#e8e2d4; --muted:#a49d8f; --line:#3a352d; }
  html,body{ margin:0; background:var(--bg); color:var(--ink); }
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center;
        font-family:Georgia,"Times New Roman",serif; line-height:1.65; padding:0 16px; box-sizing:border-box; }
  main{ max-width:32rem; text-align:center; }
  img{ width:72px; height:auto; opacity:.9; }
  h1{ font-weight:400; font-size:1.8rem; margin:1.2rem 0 .6rem; }
  p{ color:var(--muted); margin:0 0 2rem; }
  a{ color:var(--ink); text-decoration:none; border:1px solid var(--line); padding:.7rem 1.4rem;
     letter-spacing:.14em; font-size:.8rem; text-transform:uppercase; }
  a:hover{ border-color:var(--ink); }
</style>
</head>
<body>
<main>
  <img src="/assets/crest.png" alt="">
  <h1>This page has wandered off</h1>
  <p>The letter you were looking for is not here. Perhaps it was never sent.</p>
  <a href="/">Return to the house</a>
</main>
</body>
</html>
